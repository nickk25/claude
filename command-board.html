<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Command Board</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap"><style id="sty">
:root{--ground:#FBFBFC;--surface:#FFF;--ink:#14181D;--ink-2:#454E5A;--muted:#6E7885;--faint:#9AA3AF;--line:#E5E8ED;--line-2:#F0F2F5;
--att:#B0261B;--att-bg:#FCEDEB;--disc:#7A4A96;--disc-bg:#F3EDF8;--wait:#9A6410;--wait-bg:#FCF3E4;--plan:#4A5361;--plan-bg:#EEF0F3;--exec:#1B7A4F;--exec-bg:#E7F3EC;
--new:#1B5FA8;--new-bg:#E9F1FA;--btn:#EDF0F4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#0F1216;--surface:#161A20;--ink:#E9ECF1;--ink-2:#B7BFC9;--muted:#8B95A2;--faint:#6C7480;--line:#262C34;--line-2:#1E232A;
--att:#EE8377;--att-bg:#2A1614;--disc:#BE96D4;--disc-bg:#241A2A;--wait:#DFA45F;--wait-bg:#2A2013;--plan:#A7B0BC;--plan-bg:#1F242B;--exec:#5DC291;--exec-bg:#13251D;
--new:#7FAAE8;--new-bg:#14202E;--btn:#232A33}}
:root[data-theme="dark"]{--ground:#0F1216;--surface:#161A20;--ink:#E9ECF1;--ink-2:#B7BFC9;--muted:#8B95A2;--faint:#6C7480;--line:#262C34;--line-2:#1E232A;
--att:#EE8377;--att-bg:#2A1614;--disc:#BE96D4;--disc-bg:#241A2A;--wait:#DFA45F;--wait-bg:#2A2013;--plan:#A7B0BC;--plan-bg:#1F242B;--exec:#5DC291;--exec-bg:#13251D;
--new:#7FAAE8;--new-bg:#14202E;--btn:#232A33}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:34px 20px 60px}
h1{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:30px;margin:0 0 2px;letter-spacing:-.015em}
.sub{color:var(--muted);font-size:12.5px}
.q{margin:6px 0 0;font-size:13px;color:var(--ink-2)}
h2{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:30px 0 3px;font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hint{font-size:12px;color:var(--faint);margin:0 0 9px}
/* atención */
.att{border:1px solid var(--line);border-left:3px solid var(--att);background:var(--surface);border-radius:9px;padding:12px 15px;margin-bottom:8px}
.att-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.att-tag{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.02em;color:var(--att);background:var(--att-bg);padding:2px 9px;border-radius:20px;white-space:nowrap}
.att .t{font-weight:600;font-size:14px;line-height:1.3}
.att .why{font-size:12.5px;color:var(--ink-2);max-width:76ch}
.att .who{font-size:11.5px;color:var(--muted);margin-top:6px}
.att .who b{color:var(--att);font-weight:600}
.att .aff{font-size:11px;color:var(--faint);margin-top:6px}
.att .aff a{color:var(--faint);text-decoration:none;border-bottom:1px dashed var(--faint);cursor:pointer}
.att .aff a:hover{color:var(--ink-2);border-bottom-color:var(--ink-2)}
.att .iacts{margin-top:9px}
/* toggle de vista */
.viewbar{display:flex;gap:4px;align-items:center;font-size:11.5px}
.vbtn{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--btn);border:1px solid var(--line);border-radius:5px;padding:3px 9px;cursor:pointer}
.vbtn.on{color:var(--surface);background:var(--ink);border-color:var(--ink)}
.vbtn:hover:not(.on){color:var(--ink);border-color:var(--faint)}
/* card de iniciativa */
.card{border:1px solid var(--line);border-radius:9px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.card.is-att{border-left:3px solid var(--att)}
.chead{padding:11px 15px;cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.chead:hover{background:var(--ground)}
.chead .left{min-width:0}
.cname{font-weight:600;font-size:14.5px;line-height:1.3;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cmeta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.cmeta .own{font-weight:500;color:var(--ink-2)}
.cright{display:flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0}
.age{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.age.stale{color:var(--wait);border-color:var(--wait)}
.count{font-size:11px;color:var(--faint)}
.chevron{color:var(--faint);font-size:11px;transition:transform .15s}
.card.open .chevron{transform:rotate(90deg)}
.cbody{display:none;border-top:1px solid var(--line-2)}
.card.open .cbody{display:block}
.chip{display:inline-block;font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:4px;white-space:nowrap}
.stsel{font-family:inherit;font-size:10.5px;font-weight:500;padding:1px 6px;border-radius:4px;cursor:pointer;border:1px solid transparent}
.stsel:hover{border-color:var(--faint)}
.stsel:focus-visible{outline:2px solid var(--new);outline-offset:1px}
.c-disc{color:var(--disc);background:var(--disc-bg)}.c-wait{color:var(--wait);background:var(--wait-bg)}
.c-plan{color:var(--plan);background:var(--plan-bg)}.c-exec{color:var(--exec);background:var(--exec-bg)}
.newb{display:inline-block;font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--new);background:var(--new-bg);border-radius:3px;padding:0 5px;vertical-align:1px}
/* items dentro de la card */
.item{border-top:1px solid var(--line-2)}
.item:first-child{border-top:0}
.irow{padding:9px 15px 9px 15px;cursor:pointer;display:flex;align-items:flex-start;gap:9px}
.irow:hover{background:var(--ground)}
.ikindmark{width:5px;height:5px;border-radius:50%;margin-top:6px;flex-shrink:0;background:var(--faint)}
.ikindmark.ejec{background:var(--exec)}
.iheadline{font-size:13px;color:var(--ink);flex:1;min-width:0}
.ichev{color:var(--faint);font-size:10px;flex-shrink:0;transition:transform .15s;margin-top:2px}
.item.open .ichev{transform:rotate(90deg)}
.idetail{display:none;padding:0 15px 12px 29px}
.item.open .idetail{display:block}
.idtext{font-size:12.5px;color:var(--ink-2);max-width:64ch}
.isrc{font-size:11px;color:var(--faint);margin-top:6px}
.itk{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.tkt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--exec);text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap;display:inline-block}
.tkt:hover{border-color:var(--exec)}
.tksum{font-size:11px;color:var(--faint);margin-top:5px}
.iowners{font-size:11px;color:var(--muted);margin-top:6px}
.flagline{margin-top:7px;font-size:12px;color:var(--att);border-left:2px solid var(--att);padding-left:8px;max-width:56ch}
/* edición inline */
.ed{cursor:pointer;border-bottom:1px dashed var(--line)}
.ed:hover{color:var(--ink);border-bottom-color:var(--faint)}
.ed:focus-visible{outline:2px solid var(--new);outline-offset:2px}
.pinm{font-size:7px;color:var(--new);vertical-align:2px;margin-left:3px}
.iacts{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
button{font-family:inherit;font-size:11px;color:var(--muted);background:var(--btn);border:1px solid var(--line);border-radius:4px;padding:2px 8px;cursor:pointer;white-space:nowrap}
button:hover{color:var(--ink);border-color:var(--faint)}
button:focus-visible{outline:2px solid var(--new);outline-offset:1px}
.edit-off .iacts,.edit-off .cacts{display:none}
.cacts{padding:8px 15px 12px;display:flex;gap:5px;flex-wrap:wrap;border-top:1px solid var(--line-2)}
.bar{position:sticky;top:0;z-index:5;background:var(--ground);padding:8px 0 10px;margin-bottom:-4px;display:flex;gap:10px;align-items:center;justify-content:flex-end;border-bottom:1px solid var(--line-2)}
.bar .st{font-size:11.5px;color:var(--faint);margin-right:auto}
.foot{margin-top:28px;padding-top:13px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);max-width:88ch}
/* vista por owner */
.ownergroup{margin-bottom:16px}
.ownername{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0 0 6px;display:flex;align-items:center;gap:8px}
.ownername .n{font-size:10px;color:var(--faint);font-weight:400;letter-spacing:0;text-transform:none}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,18,22,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;max-width:420px;width:100%;box-shadow:0 12px 36px rgba(0,0,0,.25)}
.modal h3{margin:0;font-size:14px;font-weight:600;font-family:inherit}
.modal .mbody{font-size:12.5px;color:var(--ink-2);line-height:1.45;margin-top:8px}
.modal label{display:block;font-size:11px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.06em;font-family:"IBM Plex Mono",monospace}
.modal input,.modal textarea{width:100%;font-family:"IBM Plex Sans",inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--ground);color:var(--ink)}
.modal input:focus,.modal textarea:focus{outline:2px solid var(--new);outline-offset:1px}
.modal textarea{min-height:64px;resize:vertical}
.modal .mbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.modal button.primary{color:var(--surface);background:var(--ink);border-color:var(--ink)}
.modal button.primary:hover{opacity:.9;color:var(--surface)}
/* done */
details.donewrap{margin-top:-2px}
details.donewrap summary{cursor:pointer;font-size:12px;color:var(--faint);padding:2px 0 9px;list-style:none}
details.donewrap summary::-webkit-details-marker{display:none}
details.donewrap summary::before{content:"▸ ";display:inline-block}
details.donewrap[open] summary::before{content:"▾ "}
details.donewrap summary:hover{color:var(--muted)}
.donerow{padding:10px 15px;border-top:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.dleft{flex:1;min-width:0}
.donerow:first-child{border-top:0}
.dtopic{font-weight:600;color:var(--ink);font-size:13.5px;line-height:1.3}
.dini{font-size:11px;font-weight:400;color:var(--faint);margin-left:7px}
.dsum{font-size:12.5px;color:var(--ink-2);max-width:58ch;margin-top:2px}
.dmeta{font-size:11px;color:var(--faint);margin-top:6px}
.dmeta .tkt{margin-right:4px}
.dright{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.ddate{font-size:11px;color:var(--faint);white-space:nowrap}
.own{white-space:nowrap;font-size:13px;color:var(--ink-2)}
.none{color:var(--faint);font-size:11.5px;font-style:italic}
@media (max-width:600px){.wrap{padding:22px 12px 44px}h1{font-size:25px}.chead{flex-direction:column}.cright{align-self:flex-start}.donerow{flex-direction:column}.dright{flex-direction:row;align-items:center}}

re.Connect Sync 30 Oct: the final self-pay with public insurance flow is in the platform update thread; Toni validates, then it can go to production. Ruiz finishes legacy-value cleanup and the always-show change, then deploys (likely not Friday). Linear: GOM-4221 Dev (Ruiz), GOM-4224 In Review (Joan), GOM-4225 Dev (Ruiz), new GOM-4275 In Progress (Ruiz); GOM-4222/4223 were not in the 2-day sweep. Update 2 Nov (Linear): GOM-4275 (require an answer to the PAS consent when it applies) is Dev with Ruiz as of 30 Oct 19:32 UTC. Separately Nicolás tagged Joan and Camilo in #gomedicus-planning on 30 Oct 17:35 asking them to adjust a few things after a statement shown in a screenshot; the screenshot content is not readable here, so the topic is not confirmed. Update 4 Nov: Slack (3 Nov): Joan asked Nicolás at 16:53 to confirm the GOM-4224 consent matrix is the agreed one (one reaction yes) and asked Camilo to confirm all back-end adjustments are done so it can deploy today; at 20:29 Joan started the deployment and asked everyone to mark tested the tickets to include (8 replies, last 23:54). Linear: GOM-4221/4222/4223/4225/4275 all Dev (Ruiz), GOM-4224 Dev (Joan, 16:33). Whether the PAS consent change reached production is not stated in any source.", "own": "Joan", "dev": "Joan · Ruiz · Camilo", "tk": ["GOM-4221", "GOM-4222", "GOM-4223", "GOM-4224", "GOM-4225", "GOM-3678", "GOM-4275"], "tkSummary": "7 tickets: GOM-3678 Done; GOM-4221/4222/4223/4225/4275 Dev (Ruiz); GOM-4224 Dev (Joan)", "flag": "Weekly Planning has Joan leading the front end; Linear puts the OR-condition ticket on Ruiz.", "src": "Weekly Planning · 26 Oct 16:00 + #gomedicus-planning · 26 Oct 21:02 + Daily Care.Connect Sync · 27 Oct 09:45 + Linear · GOM-4221–4225, checked 27 Oct + Linear · GOM-4221–4225, checked 28 Oct + Daily Care.Connect Sync · 29 Oct 09:45 + Daily GoMedicus · 29 Oct 17:45 + Daily Care.Connect Sync · 30 Oct 09:45 + Linear · GOM-4221/4224/4225/4275, Linear, checked 30 Oct + #gomedicus-planning · 30 Oct 17:35 + Linear · GOM-4275, checked 2 Nov + #gomedicus-internal · 3 Nov 16:53 + #gomedicus-internal · 3 Nov 20:29 + Linear · GOM-4221–4225/4275, checked 4 Nov", "lastSignal": "2026-11-03", "nuevo": true}, {"id": "t-viactiv", "kind": "tema", "headline": "Viactiv insurer: Joan sees it listed; P0 cites a 150-record cap", "detail": "Toni (forwarded in #gomedicus-planning, 26 Oct 14:24) reported a patient who cannot book because her insurer “Viactiv” is not listed, plus a second failed booking with no reason shown. Joan replied that the insurer does appear and posted a screenshot as evidence; Camilo agreed on both and said the second error needs context, which he had already requested. The Daily Dev Sync (26 Oct 12:15) ranked the same case P0 with a different cause: the frontend fetches only 150 insurers alphabetically (GOM-2334 / GOM-3484), and a manual booking was needed by 26 Oct. Same meeting: the insurer had changed name after a merger and Tomedo was not updated; Toni handled the patient manually by choosing private insurance, and proposed a sync job pulling the insurer list from Tomedo every 2–4 weeks. That sync already exists: Camilo built it in Dev on 18 Sep (see Tomedo initiative). On 27 Oct Anna instead proposed insurances move into Carebase on a 4-week review, with Benjamin C. maintaining the list. Toni is checking with Friederike whether the insurer name must be shown or the IK number alone is enough. GOM-2334 and GOM-3484 were not in the 2-day Linear sweep and are unverified. Update 28 Oct: the insurer catalogue is now live in Carebase (see Carebase initiative); Camilo says the alternative to it was a Tomedo cron, so whether the 18 Sep Dev sync is the same thing is unclear. Update 30 Oct: the insurer-count and cadence conflict is now tracked in its own item under Partner API (“Insurer list”). GOM-4274 (GKV patients rejected on the insurer’s billing IK) is Done 29 Oct. Update 3 Nov: the failed-booking cause is now handled by the insurance-type fix (hide name for public insurance, match by number); see the Insurance-type epic.", "own": "Joan", "esp": "context for the failed booking; Toni checking with Friederike whether the insurer name is required", "src": "Daily Dev Sync · 26 Oct 12:15 + #gomedicus-planning · 26 Oct 14:24 + Daily Care.Connect Sync · 27 Oct 09:45 + #gomedicus-planning · 27 Oct 16:39 + Daily CC and CB · 30 Oct 10:15 + Daily Care.Connect Sync · 3 Nov 09:45", "lastSignal": "2026-11-03", "nuevo": true}, {"id": "t-doctorcard", "kind": "tema", "headline": "Doctor-card click now starts booking directly; review after this week’s testing", "detail": "Daily Dev Sync (23 Oct 13:30): the 22 Oct production release made a click on a doctor card start the booking process, at Anna’s request, and Nicolás and Toni will review it after testing this week. Same release: the calendar shows doctor backgrounds (see Calendar), the document download shows insurance and price info, and the acute symptoms feature went live (see Partner API).", "own": "Toni", "esp": "this week’s testing result", "src": "Daily Dev Sync · 23 Oct 13:30 + #gomedicus-dev · 23 Oct 05:08", "lastSignal": "2026-10-26", "nuevo": true}, {"id": "t-consent-doctor", "kind": "tema", "headline": "Consent not triggered for one doctor: Joan cannot reproduce, Toni asked for the appointment ID", "detail": "Lead Retrospective (23 Oct 19:00): a consent did not fire for one doctor; Joan tested the front end without reproducing it and thinks it is most likely the doctor’s error. Nicolás tagged Toni to ask for the appointment ID; without it the team waits for a repeat. Agreed rule from the same meeting: every reported issue gets a ticket, even if closed as duplicate or resolved.", "own": "Joan", "esp": "Toni sending the appointment ID", "src": "Lead Retrospective · 23 Oct 19:00", "lastSignal": "2026-10-26", "nuevo": true}, {"id": "t-latency", "kind": "tema", "headline": "Staging and booking-journey latency regression: no owner", "detail": "Team Retrospective (23 Oct 17:00) listed a frontend latency regression on staging and in the booking journey: it used to be fast and something changed at infrastructure level. It appears as a next step with no person attached, and no Linear ticket or Slack thread in the window picks it up.", "own": "", "esp": "needs an owner", "src": "Team Retrospective · 23 Oct 17:00", "lastSignal": "2026-10-26", "nuevo": true}, {"id": "e-survey-submit", "kind": "ejec", "headline": "Failed survey submit loses the survey: GOM-4172 and GOM-4026 both Done", "detail": "Linear: GOM-4172 (High, Diana) is in Dev as of 20 Oct 22:53 UTC. GOM-4026 (upload progress on every booking step, Diana) is in Stage. No meeting or Slack thread in the window discusses either. Update 22 Oct (Linear): GOM-4172 moved from Dev to Stage (21 Oct 21:29 UTC); GOM-4026 is also Stage. Update 26 Oct (Linear): both moved to Done in the 26 Oct 05:34 UTC batch. The 23 Oct production release (19 updates) is the likely carrier, but no source links these two tickets to it.", "own": "Diana", "dev": "Diana", "tk": ["GOM-4172", "GOM-4026"], "flag": "", "src": "Linear · GOM-4172/4026, checked 21 Oct + Linear · GOM-4172/4026, checked 26 Oct", "lastSignal": "2026-10-26", "nuevo": true}, {"id": "e-flow-order", "kind": "ejec", "headline": "Flow order fix GOM-4164 now In Progress with Camilo (was Todo)", "detail": "Weekly (19 Oct) confirmed the correct order: Master Data, OTP, Pick Slot, Additional Information (kids: parent master data, child master data, OTP, slot, additional information); today some cases break it, and dynamic nodes must not appear before a slot is chosen. The Weekly rated it medium priority (2–3) against the week’s other deliverables, and Camilo posted GOM-4164 (19:37) saying it apparently needs a DB change, not code, and he will do it after other priorities. Linear has it at High, Todo, Camilo; Joan reviews the front end once scope is known. Update 21 Oct (Linear): GOM-4164 moved from Todo to In Progress (Camilo, 14:27 UTC), so it is no longer waiting behind other priorities.", "own": "Camilo", "dev": "Camilo · Joan", "tk": ["GOM-4164"], "flag": "Weekly said medium priority; Linear shows High.", "src": "Weekly GoMedicus · 19 Oct 18:00 + #gomedicus-internal · 19 Oct 19:37 + Linear · GOM-4164, checked 20 Oct", "lastSignal": "2026-10-21", "nuevo": true}, {"id": "e-reason-optional", "kind": "ejec", "headline": "Optional reason-for-visit shown as required: GOM-4160 Done 20 Oct", "detail": "Weekly (19 Oct): Request Triage / REASON_FOR_VISIT is optional in the back end but the front end still showed it as required; Toni is waiting on the fix. Camilo asked Velez in #gomedicus-internal (16:31) for an urgent High-priority ticket; GOM-4160 (Urgent) was filed and moved to Done at 05:33 UTC on 20 Oct. Joan was to test it with priority and coordinate a same-day cherry-pick to production; no source yet confirms it is live in production. Linear assigns it to Zair while the Weekly named Joan as tester/deployer.", "own": "Zair", "dev": "Zair · Joan", "tk": ["GOM-4160"], "flag": "Done in Linear, but no source confirms the production cherry-pick Toni is waiting for.", "src": "Weekly GoMedicus · 19 Oct 18:00 + #gomedicus-internal · 19 Oct 16:31 + Linear · GOM-4160, checked 20 Oct", "lastSignal": "2026-10-20", "nuevo": true}, {"id": "e-ui-comments", "kind": "ejec", "headline": "Drawer email, BDT button, wording and zip download GOM-4155 all Done", "detail": "Network Config in Prod (16 Oct 14:30): Toni's walk-through of the booking journey and appointment drawer produced five requests: BDT export above the first collapsible, a button to download all appointment files as a zip (needed for the Tomedo import), the patient email next to the phone number with the same copy behaviour, rename the “reason for visit” step to “Anliegen des Termins” and the last button to “Termin bestätigen”. Nicolás posted them in #gomedicus-internal at 16:28, all front end, saying the zip could wait a week. Linear: GOM-4154 (BDT), GOM-4156 (email), GOM-4157 and GOM-4158 (renames) are Done, assigned to Zair, and Velez announced them in the 17 Oct 00:58 production release; GOM-4155 (zip download) is Todo with Ruiz. The same walk-through noted that Behandlungsgrund should become optional, configurable per partner; no ticket for it appears in the 4-day Linear sweep. Nicolás tagged Diana for these in the handover meeting, but Linear assigns them to Zair. Update 19 Oct (Linear): GOM-4155 moved from Todo to In Review (Ruiz, 20:34 CEST). Update 22 Oct (Linear): GOM-4155 (zip download, Ruiz) moved from In Review to Stage (05:33 UTC). Update 26 Oct (Linear): GOM-4155 (zip download, Ruiz) moved from Stage to Done in the 26 Oct 05:34 UTC batch, so all five tickets are Done; the Behandlungsgrund-optional request still has no ticket.", "own": "Zair", "dev": "Zair · Ruiz", "tk": ["GOM-4154", "GOM-4155", "GOM-4156", "GOM-4157", "GOM-4158"], "tkSummary": "5 tickets, all Done: GOM-4154/4156/4157/4158 live 17 Oct; GOM-4155 (zip download, Ruiz) Done 26 Oct", "flag": "“Behandlungsgrund optional per partner” was requested on 16 Oct and has no ticket.", "src": "Network Config in Prod · 16 Oct 14:30 + #gomedicus-internal · 16 Oct 16:28 + #gomedicus-dev · 17 Oct 00:58 + Linear · GOM-4154–4158, checked 19 Oct + Linear · GOM-4155, checked 20 Oct + Linear · GOM-4155, checked 26 Oct", "lastSignal": "2026-10-26", "nuevo": true}, {"id": "e-glp1-consent", "kind": "ejec", "headline": "GLP-1 consent legal page GOM-4121 Done, live in the 15 Oct production deploy", "detail": "The Zanadio and PINK booking journeys include the optional consent for off-label use, whose text points to a patient-information page that did not exist. GOM-4121 (public page /legal/off-label-use, Prod Priority, child of GOM-3938) was filed and moved to In Review the same day (12 Oct), assigned to Nicolás. Sync with Toni (13 Oct): the doctor-facing field goes in the appointment drawer as a separate field under reason for visit in the patient information, nothing embedded in existing fields. The consent documentUrl stays pending until the page is live. Update 14 Oct: Linear now assigns GOM-4121 to Joan, not Nicolás. Planning Sync (13 Oct): Nicolás opened the PR, Joan validates the flow and Camilo adds the route to the database so the link shows; Joan replied at 01:07 on 14 Oct that the route is /legal/off-label-use. Showing the three consents to professionals is tracked separately under GOM-4125 and GOM-4126 (Partner API initiative). Update 15 Oct: GOM-4121 moved to Done at 05:38 UTC with the production batch; the Daily Dev Sync confirms the GLP-1 consent and two others are placed in production (one below the reason field, two in the daily-log tag list). Joan’s 14 Oct 20:17 question about the daily log not showing two consents is answered by GOM-4125 and GOM-4126, both Done.", "own": "Joan", "dev": "Joan · Nicolás", "tk": ["GOM-4121"], "src": "Linear · GOM-4121, checked 13 Oct + Sync with Toni · 13 Oct 11:18 + Planning Sync · 13 Oct 15:35 + #gomedicus-internal · 14 Oct 01:07 + Linear · GOM-4121, checked 14 Oct + Linear · GOM-4121/4125/4126, checked 15 Oct + Daily Dev Sync · 15 Oct 10:00", "lastSignal": "2026-10-15", "nuevo": false, "flag": ""}, {"id": "t-reserved-slot", "kind": "tema", "headline": "Reserviert slot explained; blank lead-time is the 15-min default by design; throttler error still open", "detail": "In the Daily Dev Sync (13 Oct) the daily log showed the 10:30 slot as Reserviert. Explanation given: a patient mid-booking holds the slot, which auto-releases after a few minutes if the booking is not completed. While checking, the minimum booking lead-time field on the Krankenhausentlassung service was found blank (the helper text says blank means the standard 15 minutes), and a ThrottlerException Too Many Requests error appeared on screen. Toni is to follow up with Nicolás in chat. No ticket and no owner for the throttler error. Slow slot loading (about 5 seconds, seen by Toni for a week) is tracked in the Kids testing item. Update 13 Oct: Nicolás answered Toni in daily-tech-data (12:08) that a blank lead-time is not a bug: the default is 15 minutes, can be set per service, and the travel-medicine service shows a 24 h value. That closes the lead-time question. The Planning Sync lists the throttler (Toni gets \"too many requests\" constantly as admin) as a production defect; GOM-4130 (Camilo, Staging) is the likely fix but no source says so. Update 15 Oct (Linear): GOM-4130 (partner rate limit only on partner endpoints, Camilo) is Done and in the 15 Oct production batch, so the throttler error should be gone for admins; no source has Toni confirming it yet.", "own": "Camilo", "esp": "Toni confirming in production that the “too many requests” error is gone", "src": "Daily Dev Sync · 13 Oct 10:00 + daily-tech-data · 13 Oct 12:08 + Planning Sync · 13 Oct 15:35 + Linear · GOM-4130, checked 14 Oct + Linear · GOM-4130, checked 15 Oct", "lastSignal": "2026-10-15", "nuevo": false}, {"id": "t-partner-ux", "kind": "tema", "headline": "Partner UX list: GOM-4123 and GOM-4124 Done and live 15 Oct; Weekly list still not reconciled", "detail": "Toni forwarded a Sidekick (Sanadio/Pink) UX list on the booking flow. Items seen in the Slack preview: the primary CTA is pushed below the fold on mobile (suggested fix: drop the hero image on mobile or use a sticky CTA), and scroll position is not reset on step change, so after the verification code the patient lands in the footer of the next step. The Slack message is truncated, so items 3 to 5 are not visible here. Nicolás asked Joan and Diana in #gomedicus-internal to take it (12 Oct 12:53) and said item 6 should be solved by the auto-jump to the next available day. No ticket IDs were posted. Sync with Toni (13 Oct): a partner sent a second large list and wants to switch this week; Toni needs arguments to push them over the line and will translate the German list, then sync with Nicolás to split it. First easy items earmarked for Diana: the date-of-birth fix (2-3 hours) and an info-icon resize. The date-of-birth picker also came up as painful in the Kids test on 12 Oct, probably the same fix. Update 13–14 Oct: Toni posted the full 7-item list in daily-tech-data (14:25–14:33): CTA below the fold on mobile, scroll not reset on step change, date-of-birth input, insurance-number info icon, next slots on the routing-layer landing (marked fix in progress), grey Weiter button in the anamnesis step, and slots of the next available day shown on open (reported by Axia). Linear: GOM-4123 (items 1–4, High) is In Progress with Diana; GOM-4124 (Weiter button) is Todo with Diana; GOM-4055 and GOM-4056 (availability preview, Zair) are In Progress and In Review. The Weekly (18:00) reviewed a different 7-point list: it adds service-group images and an Infermedica-style design for the triage UI, and has no Weiter button or show-slots-on-open item. Nicolás and Diana sync on 14 Oct to see which are already done in staging. Nobody has reconciled the two lists. Update 15 Oct (Linear): GOM-4123 (items 1–4) and GOM-4124 (Weiter button) are Done as of 05:38 UTC; the Daily Dev Sync lists 7 UI improvements live (date picker, style fixes, mobile button visibility, service-button styling). The Weekly list (service-group images, Infermedica-style triage design) was never matched against Toni’s list; GOM-4060 (group image) is Done.", "own": "Diana", "esp": "Toni checking in production which of her 7 items are fixed; second German list still being translated", "src": "#gomedicus-internal · 12 Oct 12:53 + Sync with Toni · 13 Oct 11:18 + daily-tech-data · 13 Oct 14:25 + Weekly GoMedicus · 13 Oct 18:00 + Linear · GOM-4055/4056/4123/4124, checked 14 Oct + Linear · GOM-4123/4124/4060, checked 15 Oct + Daily Dev Sync · 15 Oct 10:00", "lastSignal": "2026-10-15", "nuevo": false}, {"id": "t6", "kind": "ejec", "headline": "3 tickets remain before staging merge; GOM-3775 advances to Dev", "detail": "The 7 tickets filed 31 Aug for the redesigned journey keep moving. GOM-3776 (identity-choice screen) stays closed Won't Do. GOM-3775 (slot preview screen) moved from In Progress to Dev (confirmed by Monday's daily-bot digest: “booking journey: appointment-slot preview screen (Dev)”). GOM-3777, GOM-3779 and GOM-3780 remain in Dev; GOM-3781 (insurance-type copy) remains In Review; GOM-3778 remains Dev. Today's Daily Dev Sync: 3 tickets remain on the feature branch, targeting a merge to staging today or tomorrow (15–16 Sep). Separately, deploy cadence is now standardised to Monday and Thursday only, never Friday — a change from the Tuesday/Thursday cadence Nicolás stated in #gomedicus-internal on 11 Sep, so this week's next deploy window is Thursday 17 Sep unless something ships today.", "own": "Velez", "src": "Sync Planning Sync · 28 Aug 16:58 + Weekly GoMedicus · 31 Aug 15:30 + Daily GoMedicus · 3 Sep 17:00 + #gomedicus-internal · 3 Sep 18:34 + Linear · GOM-3775-3781, checked 4 Sep + Linear · GOM-3775-3781, checked 8 Sep + Linear · GOM-3775-3781, checked 9 Sep", "lastSignal": "2026-09-14", "nuevo": false, "pin": {"own": true}, "dev": "Ruiz · Joan", "tk": ["GOM-3775", "GOM-3776", "GOM-3777", "GOM-3778", "GOM-3779", "GOM-3780", "GOM-3781"], "tkSummary": "7 tickets: GOM-3776 Won't Do; GOM-3775 now In Progress (up from Stuck/Paused); GOM-3777/3778/3779/3780 Dev; GOM-3781 In Review", "flag": ""}, {"id": "t7", "kind": "tema", "headline": "Telling German-insured patients apart in self-pay — flagged gap, no ticket", "detail": "Flagged as a technical gap. No ticket of its own and no further movement this window.", "own": "Velez", "esp": "nobody", "src": "Lead Sync · 24 Aug 18:48", "lastSignal": "2026-08-24", "nuevo": false, "pin": {"own": true}}, {"id": "t24", "kind": "ejec", "headline": "PIS consent gap: GOM-3803 consent-matrix alignment Done", "detail": "The missing PIS consent checkbox found in a live production test booking now has a ticket: GOM-3803 (filed 2 Sep by Benjamin H) lays out a full 24-combination target matrix f ilio. Jens blocked go-live in June on feature parity, then on the telephone AI dependency, and now says the PBS connection does not block it, contradicting his earlier position. A scoping call with Jens is needed to hit December; Benjamin (C. or H.?) to schedule it. Linear still needs Nikolai removed from the Roadmap team and the Telephone AI project, with no owner named. Update 30 Oct: Weekly (29 Oct) lists the widget replacement, telephony AI and task management as Jens’s priority 2 with scope to be shared before starting; see Content management for landing.", "own": "Benjamin (C. or H.?)", "esp": "scoping call with Jens (date not set)", "src": "Tech & Platform Office Weekly · 22 Oct 16:30 + Tech and Platform Office Weekly · 29 Oct 16:30", "lastSignal": "2026-10-30", "nuevo": true}, {"id": "e-usergroups-demo", "kind": "ejec", "headline": "User Groups link in Resource Management sidebar on dev/demo: GOM-4170 in Demo", "detail": "Linear moved GOM-4170 (High, assigned Nicolás) to Demo at 05:33 UTC on 21 Oct. It makes the User Groups entry visible on dev and demo, the only environments where task management and user groups can be seen (Task management prep, 20 Oct).", "own": "Nicolás", "dev": "Nicolás", "tk": ["GOM-4170"], "flag": "", "src": "Linear · GOM-4170, checked 21 Oct + Task management prep · 20 Oct 12:28", "lastSignal": "2026-10-21", "nuevo": true}, {"id": "t-patient-comms", "kind": "tema", "headline": "Patient comms: Nicolás’s 20 Oct prep drops KIM, reuses task comments with a guest OTP link; not agreed", "detail": "Weekly (19 Oct) left open whether the channel needs certified KIM Communications or can reuse WebSocket and task-comment tagging. Nicolás’s 20 Oct prep notes settle it on his side: KIM is for external documentation, not patient communication; registered patients pick a request type, compose and submit, professionals reply by @patient tag in the task comments, and the channel closes when done. Guests give email, date of birth and one contact method, verify by OTP (a guest account is created underneath) and get a secure link for follow-up, with a Follow up on a request entry point. Required guest fields per request type still need Frederiki’s operations input; no one is named for that. Not yet confirmed with Jens or Toni. Update 26 Oct: Weekly GoMedicus proposes exposing task management to patients as a request system (refill, referral): guest flow with OTP and secure link, task comments as the channel, an @patient tag emailing or texting the patient, channel closed when the ticket closes. A later phase adds Corti agents on the same endpoints, including voice; Corti is mandatory for patient data. It would replace DocMedico. Daily Dev Sync: the mock exists and the estimate is 3 weeks with 5 people.", "own": "Nicolás", "esp": "Frederiki’s input on mandatory guest fields; Jens and Toni agreeing", "src": "Weekly GoMedicus · 19 Oct 18:00 + Task management prep · 20 Oct 12:28", "lastSignal": "2026-10-26", "nuevo": true}, {"id": "t-task-demo", "kind": "tema", "headline": "Task engine feature-complete standalone; Jens call 20 Oct for prioritisation; outcome not recorded", "detail": "Planning Sync and #gomedicus-planning (19 Oct): Velez recorded videos of calendar, task management and user groups (all three posted 21:18 CEST) for Anna’s presentation to Jens on 20 Oct; Nicolás asked for a short English companion document per feature. Jens does not know the module and has a negative history with it. Daily (20 Oct): Toni says double bookings and doctors not joining calls are 90% of issues and the task manager can wait until December; Anna says Sebastian is overwhelmed by repeated pharmacy calls and structured intake would help. Weekly (19 Oct) frames the aim as replacing Doctor Leap and the ticket manager. Nicolás owes Anna and Toni the bullet points, mockup and videos. Update 20 Oct (prep, Nicolás): the engine has filters, dynamic user groups, templates, audit trail and patient linking; what is missing is the patient-facing entry points (widget, Telephone AI) and the patient communication loop. The goal with Jens was high-level prioritisation among organisation onboarding, patient experience and billing engine, with a follow-up including Nicolás if detail is needed. Nicolás posted the doc link, flows and mockup in daily-tech-data (11:59–13:02) and demo credentials; task management and user groups are visible only on demo, not staging. No source yet records what Jens chose.", "own": "Velez", "esp": "Jens’s prioritisation; Nicolás’s mockup and bullets for Toni", "src": "Planning Sync · 19 Oct 17:10 + #gomedicus-planning · 19 Oct 21:20 + Weekly GoMedicus · 19 Oct 18:00 + Daily Dev Sync · 20 Oct 10:00 + Task management prep · 20 Oct 12:28 + daily-tech-data · 20 Oct 11:59–13:02", "lastSignal": "2026-10-20", "nuevo": true}, {"id": "e-t13", "kind": "ejec", "headline": "V0 scope agreed: match existing patient or route to human triage", "detail": "V0: gather patient intent and match to an existing patient (linked task, one-click access), or store details for a human to triage if no match; patient creation is out of scope for v0. Toni forwarded the intake categorization before leaving — always ask existing vs. new patient first, then route: Termin, Neupatient, Rezept, Überweisung, or Sonstiges. Camilo has 11Labs access and is exploring the Anna agent config ($5,000 test budget preloaded — team needs to watch spend); likely covered by GOM-3685 (Task &amp; Workflow Manager, ElevenLabs channel intake), still Backlog. The German scope document is pending Datenschutz approval — Sebastian sent it before going on sick leave; Toni was following up but is now on vacation herself. Update 3 Sep: Camilo found and tested ElevenLabs' preview mode live in the Daily — the \"Anna\" agent answered correctly in German. $4,800 of the $5,000 test budget remains; team cautioned again not to burn it with test loops. An embedded-widget feature was also noted as usable inside tasks to trigger outbound calls. Update 8 Sep: today's Daily Dev Sync parked this initiative until the current sprint closes, planned for week 4 — no active work expected before then, independent of Toni's Datenschutz approval (Toni is back as of 7 Sep but the approval itself is not confirmed in this window). Update 10–11 Sep: Huddle with Anna (10 Sep) reframed the pause — the real driver is a Jens vs. Nikolai conflict over ElevenLabs vendor access, not a dev blocker; access has been transferred to the other party pending their own legal review, and Camilo's work so far was research only (infrastructure approach, phone-number automation), no real implementation. Daily GoMedicus (10 Sep) confirmed the pause continues, flagging German state-level privacy law as an added complication that could kill the integration outright. Product Follow Up and Daily Dev Sync (11 Sep) reframed it again as a capacity trade-off against VoraMedic's Oct 1 onboarding target — platform-side integration is built, but legal sign-off (~20 open ElevenLabs EU compliance questions) and a priority call between the two are both still pending. Update 11–14 Sep: 1:1 with Tumay (11 Sep) surfaced more detail on the ElevenLabs pause — it's already approved for one specific use case in one German region; scaling to other locations needs a broader use case and a fresh legal review, and Nicolás has a meeting with ElevenLabs lined up next week. Today's Daily Dev Sync fixed a concrete decision point: a call with Toni and Jens this Thursday will decide short scope (current build plus a few extra cases, e.g. prescription requests) vs. full scope (multi-number, multi-practice, inbound/outbound, automatic calendar booking). Nicolás needs day/hour/developer estimates for both versions before Thursday. Anna is compiling all Telephone AI documentation (Notion, Google Drive, HTML summary) to send Nicolás by end of today; Toni is sharing Simon's DSVR Word document (the scope base) with Anna. Update 14–15 Sep: Anna delivered the Telephone AI estimation materials she'd promised — an HTML platform-components document (\"validated against all existing previous documents\", her words) plus an old call-dashboard mockup found in prior materials, both posted to daily-tech-data this morning for the team to use in scoping. Lead Sync (14 Sep) set the concrete plan: two estimates needed, a light/short-scope version and a broader one; Camilo is driving the telephony estimate (more context, built it end-to-end) with Juanmanuel coordinating to offload some of Camilo's other work so he can focus; Juanmanuel instead takes the invoice estimation (see Payment initiative). Estimates don't need to be precise — rough figures plus a 3-4 day buffer are enough to give Jens a clearer scope, not a binding timeline. Target: estimates ready by Wednesday, ahead of Thursday 1pm's call with Jens, Anna and Toni (widened from the previously-expected Toni+Jens pairing). Jens is frustrated — he's been asking about telephony since last year with no visible progress from his side, and attributes the gap to his predecessor's departure; more attendees calm him down, one-on-one is worse. €5,000 in telephony credits is confirmed already allocated (consistent with the $5,000 ElevenLabs test budget tracked above). Separately, a post-call review of Telephone AI scope (14 Sep, Nicolás + Anna + Benjamin H) noted the scope has been pulled in two directions — Toni pushed for an early limited version for one specific practice, then Jens expanded it to full scope for all practices — with no requirements gathered yet from practices to back a full spec; the team's read is that platform readiness isn't the blocker, ElevenLabs legal sign-off and practice onboarding are. This morning's Claude-in-Slack digest independently confirmed the Linear state: 12 tickets, all Backlog, all unassigned, untouched since 27 Aug — the 21 Aug target has passed; both Telephone AI and the old Tasks module are complete on their own, only the engine joining them is missing. Update 16-17 Sep: reed to own the decision and move on. October 15 was confirmed as the target with Anna and communicated to Jens; legal work (~50h) is cut entirely, revisited post go-live. Nicolás flagged no more estimation cycles for Juanma — estimates will be approximate going forward. With that, Telephony, Task Management, MKD Lite and Video Intake are all parked; the only active workstream is Multi-Network/Multi-Organization, tied to the pediatrics launch. On the existing 11Labs proof of concept (built by Nicolás): calls are transcribed and parsed into a task description today, but the output is raw and not production-ready; the team agrees the minimum next step is a ‘stage 0’ to clean the data before it surfaces in tasks. Consensus: Phone AI work itself starts only after 15 Oct. Toni is to prepare a patient-communication analysis (current state, problems, solution approach, requirements) ahead of the next Jens call; Anna is reviewing the market-research links Jens shared. A short recurring 30-min brainstorm was proposed to keep reviewing the plan before the next phase.", "own": "Camilo", "dev": "", "tk": ["GOM-3685"], "flag": "", "src": "Daily Dev Sync · 26+28 Aug + #gomedicus-planning · 28 Aug 18:00", "lastSignal": "2026-09-18", "nuevo": false}, {"id": "t36", "kind": "tema", "headline": "Telephony provider for 11Labs calls still open — Twilio/Meta ruled out by data protection", "detail": "Camilo asked in #gomedicus-lead whether a telephony provider (Twilio or similar) or a Meta/WhatsApp account exists for the 11Labs calls, and how it would be integrated. Benjamin H confirmed Twilio and Meta can't be used for this — data-protection rules (Datenschutz) rule them out — so the phone number has to come from elsewhere. Plan is outbound-only calls first, then both directions. Benjamin H is still checking which provider the number the team already has actually comes from. Meeting update (3 Sep): to fully test the flow — including outbound calls to GoMedicus endpoints — a phone provider still needs to be linked. Routing plan is one number per location; whether a general number also exists is still open. Update 22 Oct: Weekly proposes WebSocket, already in the platform, as a Twilio alternative; the Telephone AI project is cancelled in Linear.", "own": "Benjamin H", "esp": "nobody — Benjamin H is investigating", "src": "#gomedicus-lead · 2 Sep 17:51", "lastSignal": "2026-10-22", "nuevo": false}, {"id": "t-billing-feature", "kind": "tema", "headline": "Billing 3.0 is Jens's top priority (15 Oct): three sources, three different staffing answers", "detail": "Jens sent over a Claude-artifact mockup of a billing feature; Toni rates it low priority against the patient-communication engine, and today's Daily Dev Sync confirmed it can't be built for real yet — it has no data source until Carebase exists, and real patient transcripts can't be used without consent, so a simulated\\/role-play demo is the only option in the meantime. Anna is writing a scoping note today (team's side vs. Carebase's side) to raise with Jens at tomorrow's weekly and get a call on whether to scope now or defer. Separately, the communication-engine thread itself is still alive: Toni is to prepare her patient-task-intake analysis first, then a short sync with Nicolás on how patient tasks come in across phone and web. Update 5 Oct (Daily Dev Sync): Jens confirmed the billing engine as top priority after pediatrics and the Medkidox sync, target 15 Oct. It touches the personal cabinet (health programs), the doctor view during calls, task management (approvals, follow-ups) and payments (insurance-covered vs self-pay unresolved). Jens shared a prototype artifact; Nicolás to assess effort with the team (Tumay suggested), Anna to share her data vision, and all three to write their own view before scoping. Contradiction: the 24 Sep note above says there is no data source until Carebase exists, while the 2 Oct Lattice Work review demoed a Carebase billing dashboard and per-patient billing recommendations (Benjamin H to show Jens; Jens has not seen it). Update 6 Oct (Weekly GoMedicus 5 Oct 15:30 + Slack): Jens launched Billing 3.0 as the new focus, 100% backend plus a connection to Domedo (as transcribed, likely Tomedo), frontend work only afterwards. Weekly: Juanma and Camilo are freed from other tasks to work on it with Nicolás; the remaining work (throttling, Sanadio and Pink reports, MKD tickets, availability revalidation) goes to Ruiz, Tumay and Oscar. Jens's forwarded message in #gomedicus-planning (5 Oct 18:58) asks for a person or team on the engine “basically yesterday” and a conversation this week on: review of the concept, infrastructure (separate engine connected where required), number of engineers, and who leads it. Anna posted her Billing Engine Data Structure Notion page in daily-tech-data (5 Oct 12:59) asking Nicolás and Toni to review. Contradiction: the 10:00 Daily Dev Sync named Tumay as the natural fit and Nicolás as assessor; the 15:30 Weekly gave it to Juanma and Camilo; Jens's message leaves the lead open. Nicolás also said (19:46–19:55) the only new backend topic is Jens's and it should be planned technically only while partner work continues, while Juanma wants partner API first because partners are slow to integrate. Update 7 Oct (Billing Sync 6 Oct 15:37 + Frontend Sync 6 Oct 18:46): the two same-day meetings gave opposite answers on where the engine lives. Billing Sync said it should live in Carebase so other organisations can consume it by API; Frontend Sync reached consensus it should be a separate external service, with Carebase only one data source. Staffing differs again: Billing Sync names Camilo and Tumay as natural fits (Camilo's German, risk of losing him from GoMedicus) while Juanma is asked to help Velez and write the review; Frontend Sync has Juanma drafting a high-level infrastructure proposal before today's meeting with Jens, Anna, Benjamin H. and Nicolás. Whether billing covers private insurance (GOA) is unconfirmed. Anna is organising the data structure in parallel. Update 8 Oct (Daily Dev Sync 10:00): Jens's artifact and prototype reviewed. The engine is a seven-step pipeline where only the service-capture step uses a language model and billability is rule-based and explainable. Proposed phasing is public insurance first (about 90 percent of business), private and self-pay after, pending Jens's sign-off since he may prefer faster-cash-flow self-payers. Blockers named before development can start: where the engine lives, what Carebase exposes, who is the medical/billing domain expert, scope and team, and a test environment. The Jens technical deep-dive is now Tue 14 Oct 9:00-10:00, so the 7 Oct meeting recorded below did not produce the staffing answer; Anna shares her billing prep artifact with Nicolas beforehand, and Toni (on sick leave today and likely tomorrow) will not join. Staffing is still unanswered: no source names the engineers or the lead.", "own": "Juanma", "esp": "Jens naming who leads it; Nicolás's effort assessment and Anna's data vision", "src": "Daily Dev Sync · 24 Sep 10:00 + Daily Dev Sync · 5 Oct 10:00 + Lattice Work · 2 Oct 16:00 + Weekly GoMedicus · 5 Oct 15:30 + #gomedicus-planning · 5 Oct 18:58-19:55 + daily-tech-data · 5 Oct 12:59 + Billing Sync · 6 Oct 15:37 + Frontend Sync · 6 Oct 18:46 + daily-tech-data · 6 Oct 12:03", "lastSignal": "2026-10-08", "nuevo": true}, {"id": "t-taskmgmt-scoping", "kind": "tema", "headline": "Roadmap shown 13 Oct: task management first (step 1 on 1 Jan 2027), calendar pushed to 2027", "detail": "Daily Dev Sync 5 Oct: Toni's first instinct was calendar first but she is thinking it through; Anna and Toni lean to task management as more critical, and Jens sees it as the CRM core of the platform. Juanma is named responsible for core engines (identity, task management). Nicolás to schedule Thursday's workflow scoping with Toni and add Anna; Toni to post her prioritisation in chat afterwards. This sits against the board's earlier note that Task Management was parked until after 15 Oct. Update 8 Oct (Daily Dev Sync): no mention of the Thursday scoping meeting in today's notes, and Toni, who owns the prioritisation, is on sick leave today and likely tomorrow, so it cannot run today as planned. Daily syncs on Monday and Wednesday move to 12:00 or afternoon from now on because of Nicolas's German classes. Update 13 Oct (Daily Dev Sync, Anna’s Priorities 2026/2027 roadmap on screen): task management is priority 1 for the rest of the year, step 1 (telemedicine) on 1 Jan 2027 and step 2 (Praxis) on 2 Feb 2027, with the calendar following both (A5, 1 Apr 2027) and pushing it into 2027 called realistic. The widget is the patient-facing UI for the task engine; Corti could sit in the middle as a chat layer making tool calls, which needs investigating before committing. Against this, calendar tickets are still moving (see the Calendar initiative) and Billing 3.0 is still on the board as Jens’s 15 Oct priority while the roadmap runs billing and entitlement to 1 Jul 2027.", "own": "Anna", "esp": "Jens’s confirmation of the order; no source says he approved it", "src": "Daily Dev Sync · 5 Oct 10:00 + Daily Dev Sync · 13 Oct 10:00", "lastSignal": "2026-10-13", "nuevo": true}, {"id": "t-idle-features", "kind": "tema", "headline": "Task Manager and Telephone AI idle at ~70-80%; Telephone AI needs Task Manager finished first", "detail": "Jens’s concern at the 9 Oct Weekly: operations are asking when things launch and getting no answer. Decision: split into focused teams instead of one team jumping across topics; Anna shares the roadmap artifact and runs a prioritisation session. Billing 3.0 elsewhere on this board is staffed with Juanma and Camilo on a 15 Oct target, while Jens also wants 2-3 dedicated engineers on the billing engine and Benjamin H. says Carebase must be live first.", "own": "Anna", "esp": "Jens (prioritisation session before he leaves 14 Oct)", "src": "Tech &amp; Platform Office Wee  2. Nicolás is preparing mockups for review later today or tomorrow morning. Update 15 Sep: Nicolás shared the mocked side-by-side redesign with Toni this morning (screenshot posted 10:31); by 11:22 he asked whether she'd still prefer something more compact. Toni's feedback (11:37–11:39): keep a \"Termin buchen\" button in case patients don't realize the service boxes themselves are clickable; drop the arrows on each box (personal preference) and show just the service-type name; clicking \"Termin buchen\" should land on the general service-group page, while clicking a specific service type should jump straight to that type. Not yet incorporated into a revised mock as of this sweep.", "own": "Nicolás", "esp": "Nicolás incorporating Toni's 15 Sep feedback (drop arrows, keep a booking button, two distinct click destinations) into the next mock", "src": "Landing Page - Adaptions for GoM and GoM Kids · 10 Sep 9:30", "lastSignal": "2026-09-15", "nuevo": false}, {"id": "t53", "kind": "tema", "headline": "GoMedicus Kids: new landing box + dedicated subpage, content from Friederike pending", "detail": "Jens wants a dedicated “GoMedicus Kids” box on the landing page alongside Reisemedizin, Gewichtsmanagement etc. — clicking it leads to a separate subpage explaining the offering, with booking available there; for now it's the only service with its own subpage flow. The Cloudnonic dev team builds the subpage (sole repo access). Friederike is preparing the content; Toni will use Claude to draft the design from that content once it lands. The pediatrics network itself (triage via Infermedica, MCAD integration, week-40 target) is tracked under Multi-network platform below, not here. Update 14 Sep (Daily Dev Sync): Friederike is preparing the subpage content; Toni will draft the design from it via Claude once it lands; the Cloudnonic dev team builds the subpage itself. Still waiting on Infermedica for children's triage access — Anna following up with Ivona. Child booking flow still ng and Partner API side (see GOM-3938 under Partner API) — instead of hardcoding service groups and links, the landing page would read them from the backend's routing layers. Update 20 Oct (Linear): GOM-3922 is closed as Duplicate; GOM-3917 (routing-layer catalog endpoint, Camilo), GOM-3840 (unique hash per routing layer, Camilo), GOM-3841 (route from the journey hash, Joan) and GOM-4006 (booking preview on routing-layer landings, Ruiz) are Done; GOM-4015 (prefer the journey hash for booking links, keep ?serviceType= as fallback, Joan) is In Progress.", "own": "", "esp": "needs an owner", "tk": ["GOM-3922", "GOM-3917", "GOM-4015"], "flag": "", "src": "Linear · GOM-3922, checked 18 Sep", "lastSignal": "2026-10-20", "nuevo": true, "tkSummary": "GOM-3922 Duplicate; GOM-3917/3840/3841/4006 Done; GOM-4015 In Progress (Joan)"}, {"id": "t77-ai-disclaimer", "kind": "ejec", "headline": "AI-image disclaimer ticket conflicts with new law: AI doctor images must be replaced", "detail": "GOM-3973 (add an AI image disclaimer to the service-group type image and page) filed, still Todo, unassigned — reads like a follow-on from the earlier “KI-Estelle” trust-labeling work under the image epic above. Contradiction 30 Sep: GoM Kids Design said a new law prohibits AI-generated images of doctors or medical professionals on the site, so service cards labelled \"Mit KI erstellt\" must be replaced (Sebastian is adapting stock photos received from Henry), while GOM-3973 (Todo, unassigned) only adds a disclaimer. Replacement vs. disclaimer has not been reconciled between the two.", "own": "", "esp": "needs an owner", "tk": ["GOM-3973"], "flag": "GOM-3973 adds a disclaimer where the 30 Sep call says the images must be replaced — decide which applies, and who owns it.", "src": "Linear · GOM-3973, checked 21 Sep + GoM Kids Design · 30 Sep 10:30", "lastSignal": "2026-09-30", "nuevo": true}, {"id": "e-i18n-keys", "kind": "ejec", "headline": "Raw i18n keys in header menu and care team page: GOM-402 rtner-facing documentation page, reachable by link only and updated as the API changes, is planned. Nicolás shortlists documentation tools, Camilo or someone similar evaluates and chooses, and Sebastian is consulted on provider compliance (Sentry, terms acceptance). Slack already holds an earlier answer: GOM-3906 (rebuild the partner API documentation package, one PDF plus one Postman) was delivered 23 Sep, Postman documentation links were sent to DoctorBox on 7 Oct and 15 Oct and to a third partner on 2 Oct, and GOM-4084 (Partner Integration Guide and Postman) is In Progress with Oscar as of 20 Oct. The meeting does not mention any of these, and Marco’s missing pharmacy-endpoint question is a gap in that existing documentation rather than a missing page. Update 26 Oct: Lead Retrospective (23 Oct): the Postman collection is updated by hand and should be generated from the code; Fern (open source, free plan, 10 teammates, 1,000 pages) is the candidate and Camilo files a research ticket for Oscar. Team Retrospective: Camilo also wants versioned, auto-updating partner docs instead of PDF, and Zair proposes an internal developer handbook. Camilo already named Fern as the target in a message to Nicolás on 23 Sep (GOM-3906), so this restarts a plan from a month ago. Camilo also files a ticket for a read-only API showing booking journeys per routing layer and service, without building endpoints yet. Update 4 Nov: Weekly GoMedicus (3 Nov): partner docs are Postman only with no automated sync; Camilo is to create a ticket exploring Fern or similar for auto-updated API docs. Alejandro Valencia’s next task could also be partner API documentation.", "own": "Camilo", "esp": "Camilo creating the ticket", "src": "Checking AK and DB Flow · 21 Oct 16:30 + Slack search · Postman and API documentation, Sep to Oct + Lead Retrospective · 23 Oct 19:00 + Team Retrospective · 23 Oct 17:00 + Slack DM Camilo to Nicolás · 23 Sep 05:52 + Weekly GoMedicus · 3 Nov 16:00", "tk": [], "nuevo": true, "lastSignal": "2026-11-03", "flag": "Fern was already the stated plan on 23 Sep; the 23 Oct retro treats it as a new idea."}, {"id": "t-triage-drawer", "kind": "ejec", "headline": "Partner-uploaded triage in drawer: GOM-4179 and GOM-4180 both Done", "detail": "Checking AK and DB Flow (21 Oct): both the DoctorBox and AKA test bookings show the partner-uploaded triage PDF in the Documents list, probably a missing backend label, and it should appear in the appointment drawer’s Triage section and be saved as not visible to the patient. For a patient with two appointments only the current appointment’s triage should show in the Triage section, while all results stay in the general Documents tab. Camilo takes it and was told to check for an existing ticket with “Johan” (probably Joan; the name is garbled in the notes); no matching ticket appears in the 2-day Linear sweep, and GOM-4087 (triage skipped warning, Stage) is adjacent but a different change. Related to the 20 Oct note that DoctorBox triage results are not visible in GoMedicus. Update 22 Oct: the open question is answered. Daily GoMedicus 22 Oct has Ruiz on two tickets from Camilo to show externally uploaded triage in the appointment drawer: GOM-4179 (backend, Dev) and GOM-4180 (front end, In Review). The bug was the drawer saying no triage uploaded for non-nursing triage; fix shows the file when present, hidden from patients and visible to partners. Update 26 Oct (Linear): GOM-4180 is back in Dev (23 Oct 19:14 UTC), alongside GOM-4179. Update 30 Oct (Linear): GOM-4179 Done 29 Oct 05:34 UTC, GOM-4180 Done 28 Oct 22:41 UTC. GoM / AK confirmed the staging triage file shows name, phone, routing layer, email and results.", "own": "Ruiz", "esp": "review and release of GOM-4180", "src": "Checking AK and DB Flow · 21 Oct 16:30 + Daily GoMedicus · 22 Oct 17:45 + Linear · GOM-4179/4180, checked 23 Oct + Linear · GOM-4179/4180, checked 26 Oct + Linear · GOM-4179/4180, Linear, checked 30 Oct", "nuevo": false, "lastSignal": "2026-10-30", "tk": ["GOM-4179", "GOM-4180"], "dev": "Ruiz", "flag": ""}, {"id": "e-doctorbox-newapi", "kind": "tema", "headline": "DoctorBox test booking reviewed 21 Oct: mock email, pharmacy name and phone, triage under Documents", "detail": "Signatur Privatrezepte (20 Oct): the newest DoctorBox tablets auto-update and sent 2 confirmed bookings through the new CareConnect API on Monday; older tablets may still use the old API, which stays live because the GoMedicus frontend uses it. Triage results from new-API bookings are not yet visible in the GoMedicus triage section; the field is optional so operations are not blocked, DoctorBox sends the triage as a PDF, and it becomes mandatory once confirmed. Julian books a live test appointment for the week of 26 Oct so Nicolás can check every field and the triage PDF, and tests the Stripe flow for non-German private patients, which he has not tried on the test environment. This sits next to the 1 Oct note that partner-uploaded triage was in Staging; no source says what changed for production. Update 21 Oct (Checking AK and DB Flow, Nicolás + Toni): the 20 Oct note expected Julian to book a live test in the week of 26 Oct, but his test booking (for 23 Oct, canceled) was already reviewed with only 4 gaps: the patient email was a mock, pharmacy name and pharmacy phone were not populated (optional fields in the reserve endpoint that partners may not know to send), and the partner-uploaded triage PDF shows under Documents instead of the Triage section. Patient notifications are now a setting on the new API and are off for DoctorBox, so no GoMedicus email reaches patients; Julian’s own emails must say the doctors are from GoMedicus, and Toni is requesting his templates. Consents: treatment_contract and confidentiality_release are required, pas_billing is optional (self-payers only). Documents of a canceled guest appointment are soft-deleted, which is expected per Sebastian’s legal guidance. Update 26 Oct: see the DoctorBox item above; Nicolás re-sent the open list and Toni forwards it to Julian.", "own": "Camilo", "esp": "Julian’s email templates (Toni requested) and his live end-to-end test", "src": "Signatur Privatrezepte · 20 Oct 12:00", "lastSignal": "2026-10-26", "nuevo": true}, {"id": "t-aka-prod", "kind": "tema", "headline": "AK: production test Fri 30 Oct, go-live Mon 2 Nov; acute-check bypass flow still to be shared", "detail": "Nicolás asked Camilo (#gomedicus-planning, 19 Oct 15:25) to leave AKA configured in production but send no credentials until Toni has seen Marco’s flow working; this could wait a day or two. See the attention flag on this initiative for the open AK patient-email question. Update 21 Oct (Checking AK and DB Flow): this replaces the 19 Oct plan to hold credentials until Toni validated the flow. Camilo sends production credentials to Marco with Toni in copy for a live end-to-end test on Friday 23 Oct, and Marco asked not to go live until given the go-ahead. The AKA staging appointment showed pharmacy name and phone, a real patient email and an uploaded triage document, but Marco could not find the Apothekenname and Apothekentelefonnummer endpoint because it is not in the partner-facing docs; Camilo adds the optional fields to the docs and Nicolás sends Marco the reference. A patient with two appointments shows two triage results; only the current appointment’s should appear in the Triage section. Juanma is out until early November, so Marco copies Toni on technical questions and she forwards them to Nicolás. Update 23 Oct: the AK Flow x GoM meeting with Marco, Christian Schneider, Toni and F Posnien started 11:30 today; its note is empty so far. The Weekly (22 Oct) listed DoctorBox this week and AKA next week, which differs from this live test being today. Update 26 Oct (AK Flow x GoM, 23 Oct 11:30, Marco, Christian, Toni, Friederike, Nicolás): production code is live but inactive while Marco separates routing layers. Only two layers matter for go-live, ARCA Apotheken and Medevice Apotheken, kept separate; Medivis ZNA, Nuvoo and My7Steps are deferred. Marco can go live with the ARCA flow alone on a single layer if multi-routing is not ready. Tuesday 27 Oct 1 PM call (Toni scheduling; Friederike and Nicolás invited) is to confirm prod and do a final walkthrough; if prod is ready, first real booking could be Wed 28 Oct. Needed before then: (1) a second staging routing-layer key so Marco can test ARCA and Medevice separately, plus the booking journey duplicated in staging, wanted before 4 PM on 23 Oct; (2) call start time and provider-side duration (about 10 min, against 15 min patient-facing) on staging; (3) data-forwarding consent verified on every production routing layer; (4) Marco to send pharmacy name and phone via the reserve endpoint, whitelist the new staging API IP range and send the official insurer-list source (GoMedicus currently pulls from Tomedo; refreshed about every 4 weeks). Patient matching is by email, so a mistyped email creates a duplicate patient; a merge job is planned but not built. Same day Nicolás asked Camilo twice (#gomedicus-internal 12:19, Daily Dev Sync 13:30 to duplicate two production routing layers to staging; Toni deletes unused Medivis, ZNR and Lushen). Lead Retrospective (19:00) still lists the staging items as Camilo’s next steps: start time and duration to staging and an email to Marco that the data-forwarding field set to false breaks call creation (Granola labels this section Carebase/MKD; the content matches AK Flow); the optional notifications field is not identified yet and Camilo asks Marco by email. Update 28 Oct: Final Testing AK Flow x GoM (27 Oct 13:00, Marco, Christian, Toni, Friederike, Nicolás): test booking for 28 Oct 10:20 reached GoMedicus production with patient, insurance and pharmacy data; an “Invalid request” came from an IK number mismatch (one insurer, several IKs) and Marco fixed it by choosing the right IK; Marco sends the insurance IK list. Doctor title (Dr. med.) is missing in the platform; AK will add a title field and send it by API; specialty is hardcoded on AK’s side. Some GoMedicus doctors do not appear in the AK flow because AK queries only a few days of availability to stay under GoMedicus rate limits; agreed display window is 4 weeks, and the single “GoMedicus card” option is not legally viable (free doctor choice must stay). Triage: required for all bookings per GoMedicus legal guidance (patient seen in practice within 2 quarters; telemedicine does not count); Christian says this breaks repeat prescriptions; Toni escalates the skip question to Jens today and a new legal colleague joins next week. Short term Christian disables the “Ohne Ersteinschätzung fortfahren” button (closes skip for all AK users); Marco builds a runtime PDF from the XUND response before triage becomes mandatory on Mon 3 Nov. Cloudnonic is building webhooks so AK, not GoMedicus, notifies patients of changed appointments. Toni and Christian schedule a follow-up call by Thu 29 Oct. Update 30 Oct: GoM / AK (29 Oct 14:00) set the plan: production end-to-end test Friday 30 Oct with a friendly doctor (Nele or Sabrina, 7:00–18:30) using a made-up valid e-card, then go-live Monday 2 Nov to avoid weekend on-call risk. The triage skip button text is replaced globally with “Falls der/die Patient:in keine neuen Symptome … Ersteinschätzung hier übersprungen werden” plus the subtitle “Nur für Folgerezepte und Folgeverordnungen”. AK must send the acute-symptom field via the API to bypass triage (field is optional today); Camilo was to share the exact flow and field name by about 16:00 on 29 Oct. Rate limits were flagged but are not blocking Monday. Triage file reviewed in staging: all fields present. Update 3 Nov: Daily CC and CB: the production API response still shows acuteCheckEnabled false and acuteCheck null, even though Toni confirmed she activated the acute-check rule in production. Behaviour was verified working (the “no acute symptoms” path shows triage skipped, the triage path shows triage when triggered). The flag was handed to Camilo to review. No source in this window says whether AK went live on Mon 2 Nov.", "own": "Toni", "esp": "Camilo reviewing why the API reports acuteCheckEnabled false; AK go-live not confirmed in any source", "src": "#gomedicus-planning · 19 Oct 15:25 + Tech & Platform Office Weekly · 22 Oct 16:30 + AK Flow x GoM · 23 Oct 11:30 + AK Flow x GoM · 23 Oct 11:30 + Daily Dev Sync · 23 Oct 13:30 + Lead Retrospective · 23 Oct 19:00 + #gomedicus-internal · 23 Oct 12:05–12:19 + Final Testing AK Flow x GoM · 27 Oct 13:00 + GoM / AK · 29 Oct 14:00 + Linear · GOM-4271/4272, Linear, checked 30 Oct + Daily CC and CB · 3 Nov 10:15", "lastSignal": "2026-11-03", "nuevo": false}, {"id": "t-latency", "kind": "tema", "headline": "Production p99 latency alarm fired twice on 16 Oct, coinciding with DoctorBox confirmations", "detail": "Handover (16 Oct): the p99-latency-high alarm in eu-central-1 hit 9.88 s and 7.56 s at 07:42 and 07:47 UTC against a 2 s threshold, then 4.64 s and 4.29 s at 09:35 and 09:40; both windows coincide with DoctorBox (Apotheken) appointment confirmations for the same doctor. Nicolás was to try to reproduce it with the production doctor after midday to tell front end from back end; no result is recorded. Related debt: slot validation trusts partner data blindly, and GOM-3881 (validate professional availability when reserving, Camilo) is still Todo as of 15 Oct. Redis has no monitoring beyond Redis Insight and the health check may cover only one of its two processes; Camilo is to file a ticket.", "own": "Nicolás", "esp": "Nicolás’s reproduction result; GOM-3881 still Todo with Camilo", "tk": null, "src": "Juanma’s handover · 16 Oct 16:15 + Linear · GOM-3881, checked 19 Oct", "lastSignal": "2026-10-16", "nuevo": true}, {"id": "t-dup-booking", "kind": "tema", "headline": "One patient booked the same DoctorBox service 4 times on 16 Oct; no owner", "detail": "daily-tech-data (16 Oct 12:17–12:23): Toni saw one patient book four appointments in a row and asked whether a rule blocks that. Nicolás: the rule is per service, blocks the same day and needs identical patient information. Toni: the service is “Erstvorstellung”, all four came through the DoctorBox routing layer, same day. Huddle with Toni (16 Oct 16:10): likely DoctorBox generating duplicate email addresses; if so DoctorBox should fix it, and Nicolás would raise it with the team to see whether Cloudnonic can avoid it. No ticket and no owner appear in any source; Toni also sees the same patient four times in the booking view.", "own": "", "esp": "needs an owner", "src": "daily-tech-data · 16 Oct 12:17 + Huddle with Antonia · 16 Oct 16:10", "lastSignal": "2026-10-16", "nuevo": true}, {"id": "t-docsclouds", "kind": "tema", "headline": "Docs &amp; Clouds wants its doctors on GoMedicus while keeping its own video; use case still to be sent", "detail": "Planning Sync (13 Oct): Docs &amp; Clouds has its own telemedicine solution and must keep it. Jens proposes booking through the GoMedicus API, a deep link to their video and documentation sent back to GoMedicus. Nicolás: not that simple, transcription, appointment closure and automatic no-show need studying; the alternative is embedding their video player in the GoMedicus frontend, which keeps consents and flow here and depends on the provider supporting embedding with connected physical devices. Next: Benjamin H. sends the use case, Nicolás gives feedback, then a technical call that includes Benjamin C. for FHIR data exchange. Their API documentation was never delivered and should be requested before that call. Slack search found no earlier substantive thread on this.", "own": "Benjamin H.", "esp": "Docs &amp; Clouds API documentation, never delivered", "src": "Planning Sync · 13 Oct 15:35", "lastSignal": "2026-10-13", "nuevo": true}, {"id": "e-consent-display", "kind": "ejec", "headline": "Consents shown to professionals: GOM-4125 and GOM-4126 Done, live 15 Oct", "detail": "Planning Sync (13 Oct): three extra consents are already painted in the booking flow, but professionals cannot see the answers yet. \"Sharing co-treatment for physician\" and \"Data sharing with Giga\" show in the Daily Log (network manager); the off-label declaration shows in the appointment drawer under reason for visit. All consents are optional; data comes per appointment and the frontend decides who sees what. Linear: GOM-4125 (include appointment consents in the appointment details response) is In Review with Ruiz, Urgent, created by Camilo on 13 Oct after Joan asked in #gomedicus-internal whether a ticket existed; GOM-4126 (show the consents in drawer and daily log) is Todo with Zair, though Joan said she would build the front and try to distribute it in the Weekly. Weekly: dynamic per-partner consent support in the frontend, PR assigned to Joan for analysis, deadline Friday. Update 15 Oct (Linear and Daily): both Urgent tickets are Done as of 05:37 UTC. Consents are now frontend-only, so new partner consents need no backend change.", "own": "Ruiz", "dev": "Ruiz · Zair · Joan", "tk": ["GOM-4125", "GOM-4126"], "tkSummary": "", "flag": "", "src": "Planning Sync · 13 Oct 15:35 + #gomedicus-internal · 13 Oct 16:38 + Linear · GOM-4125/4126, checked 14 Oct + Linear · GOM-4125/4126, checked 15 Oct + Daily Dev Sync · 15 Oct 10:00", "lastSignal": "2026-10-15", "nuevo": true, "esp": "nobody"}, {"id": "t-marco-ratelimit", "kind": "tema", "headline": "Marco/AK rate-limit and consent-key reply: top priority for Camilo, overdue since 29 Oct", "detail": "Nicolás’s 12 Oct notes: the answer to Marco on the rate limit goes out tomorrow, once Camilo has deployed and the full information is known; Nicolás planned to review the rate limit that night before replying. The source does not say which partner Marco belongs to; the FDA rate-limit item below (GOM-4018 Staging, GOM-4019 Todo) may be the same thread but that is not confirmed. No reply is visible in the sources read. Update 14 Oct: Planning Sync (13 Oct) lists rate limit, join link, cancel and call ID as the four App improvements for production; two are in staging, cancel and call ID are tested and the rate limit still needs its final review. Camilo notifies Marco and Julian once live. The Weekly says the rate-limit improvement may deploy on 13 Oct; no source confirms it did. Update 15 Oct: the production deploy Marco’s answer waited on has happened (GOM-4130 Done), but the go-live email to Marco is still pending after the 15 Oct Daily. Update 3 Nov: Nicolás’s priority list in #gomedicus-planning (09:23) puts Marco / AK as top priority for Camilo, all in production this week: confirm whether the limit is per key or per IP and whether AK’s key can go to 300–600 per 15 minutes; roughly what a per-day slots-with-doctors endpoint would take; confirm that the consent key data_forwarding_to_gomedicus is configured in production and matches the API docs (Marco was told on 23 Oct it was not in production but now sees it as optional there). Camilo is then to choose the quick fix (raise the limit) or the per-day endpoint with Toni, and send Marco an assessment and timeline, including whether one query can cover both routing layers. Nicolás marks the reply overdue since 29 Oct. The same topic is also held by the Rate limits item above with Nicolás as owner; the two items are one thread.", "own": "Camilo", "esp": "Camilo’s reply to Marco (overdue since 29 Oct): limit change or per-day endpoint, consent key check, timeline", "src": "Small sync · 12 Oct 19:24 + Planning Sync · 13 Oct 15:35 + Weekly GoMedicus · 13 Oct 18:00 + Daily Dev Sync · 15 Oct 10:00 + #gomedicus-planning · 3 Nov 09:23", "lastSignal": "2026-11-03", "nuevo": false, "attention": {"why": "The reply to Marco is overdue since 29 Oct, and two items on the board give it two different owners (Camilo here, Nicolás in the rate-limits item). The consent-key check and the limit change both gate AK’s production use.", "tag": "Overdue since 29 Oct; owner split"}}, {"id": "t-triage-notrequired", "kind": "ejec", "headline": "Acute check detached from Infermedica (GOM-4271 Done); Apotheken service type awaits Nicolás’s Postman check", "detail": "GM Sync (2 Oct 11:01, Nicolás + Toni): Jens confirmed triage is not required for most service types, which clears the long-standing reason partners refused to go live. Toni updated the service-type list (done from the backend); Camilo to review. Jens added a new requirement: a pre-booking acute-symptoms question — yes routes to triage, no goes straight into the booking flow. Nicolás estimates a week or less; the main risk is merge conflicts with what is already on staging (Kids flow, Infermedica changes). Toni can tentatively commit to end of next week (~9 Oct) for staging delivery, but only once Nicolás confirms the deployment path with the team. Partners are waiting on Toni's reply today. No Linear ticket exists yet for the acute-symptoms question (GOM-4032, removing the triage notice from the master-data step, Todo, Zair, may be adjacent — not confirmed). This reverses two earlier positions: the 8 Sep Daily Dev Sync decision that triage is mandatory for all public-insurance patients with no partner exceptions, and the 25 Sep instruction to hold the line on AK Apotheken's triage requirement. Update 5 Oct: Toni posted the written spec in daily-tech-data on 2 Oct 13:54 (one required yes/no question, neutral wording, configurable text, switchable per service, answer and skip flag stored per booking; 16 listed service types; target live ~9 Oct) and Nicolás confirmed it was clear. Toni's reply at 14:21: the rule should be all service types that are not self-pay and do not have the triage-needed box ticked. Monday's Daily Dev Sync restated it as: ask publicly insured patients only, yes routes to triage, no skips it, and Jens accepted the Abmahnung risk. The two accounts differ on first consultations: the Slack list includes Erstber
