tions and partner API connections go through Carebase and CareConnect becomes the patient interface. Anna’s unresolved cases: a patient who refuses cross-system sharing needs a CareConnect-only fallback. Toni raises the live partner API risk at Thursday’s tech and platform meeting. The 90-day data retention rule has no sign-off from Sebastian, the lawyer or anyone legal; the new data officer joins 1 Nov. Insurance list moves to Carebase with Benjamin C. maintaining it. Daily CC and CB (27 Oct): Anna shares the data-flow and edge-case document in Slack after the call. Nicolás has Camilo’s full Carebase test repo and shares it with Benjamin C.’s organization today. Update 28 Oct: Anna said (daily-tech-data, 27 Oct 10:50–10:54) she keeps all partners on CareConnect and structured the CC vs CB file that way, and will keep protecting that idea with Jens and Benjamin C.; Toni agreed (switching partners means a lot of work for them and the partners, and partners connecting through the API does not go against Carebase); Nicolás said he does not see the need to move partners and thinks the whole idea is mixed up. Benjamin C. (Daily CC and CB) has started a consent layer in Carebase: contracts can be flagged consented or revoked, and linking data without consent returns an error. Anna’s edge cases for decision: patient refuses consolidation (data stays on CareConnect only), patient moves, consent form not found. Anna also asked Toni for her priorities file from the Jens call; Toni shared it, still WIP.", "own": "Benjamin C.", "esp": "Jens’s answer to the partner API risk (Thursday); legal sign-off", "src": "Daily Dev Sync · 26 Oct 12:15 + Daily CC and CB · 27 Oct 10:15 + daily-tech-data · 27 Oct 10:50", "lastSignal": "2026-10-27", "nuevo": true}, {"id": "t-carebase-postman", "kind": "tema", "headline": "Camilo Carebase Postman tests: test 1 passes, test 2 fails on ICD/CAPES storage", "detail": "Daily 22 Oct: Camilo ran Postman tests against Benjamin API with a Tomedo mock. Test 2 needs ICD codes, CAPES and appointment references stored; Tomedo cannot store ICDs, a PMS constraint, and other PBS will differ. Next: Camilo sends structured questions (not a full assessment) to Anna, Toni and Benjamin C.", "own": "Camilo", "esp": "replies from Anna, Toni and Benjamin C.", "src": "Daily GoMedicus · 22 Oct 17:45", "lastSignal": "2026-10-22", "nuevo": true}, {"id": "t-carebase-0422", "kind": "tema", "headline": "care.base weekly 22 Oct: Benjamin C. presents it as a store, not a pass-through", "detail": "Benjamin C. presented care.base to Jens, Benjamin (C. or H.?) and S Rachwalski: HAPI FHIR R4 store with Python ingestion, one partition per Gesellschaft, KVNR identity matching, consent opt-in before linking, four-eyes deletion, and the goal of becoming the network internal ePA. Open items: legal retention rules ePA vs PBS, internal-note policy, and whether consent and matching stay in CareConnect (existing logic may stay for the first 12 months). Nothing recorded on the earlier layer-versus-database disagreement.", "own": "Benjamin C.", "esp": "legal retention answer; internal-note policy", "src": "care.base weekly · 22 Oct 15:00", "lastSignal": "2026-10-22", "nuevo": true}, {"id": "t-consent-host", "kind": "tema", "headline": "Who hosts the consent engine is undecided; Simon (legal) still discussing", "detail": "Daily (19 Oct): Benjamin C. spent about 20 minutes of the Weekly on CareConnect consent and data issues and drew a parallel to GoMedicus; Anna corrected that GoMedicus has one network only. He will likely escalate to Jens. The team wants answers ready if Simon or Jens raises the consent engine.", "own": "", "esp": "needs an owner", "src": "Daily Dev Sync · 19 Oct 12:00", "lastSignal": "2026-10-19", "nuevo": true}, {"id": "t-carebase-staging", "kind": "tema", "headline": "Camilo to rebuild fullest Carebase case in staging and give Benjamin C. real feedback today", "detail": "Planning Sync and #gomedicus-planning (19 Oct): Nicolás sends Camilo the requirements document; Camilo recreates the most complete case (consents, documents) in staging and tells Toni; he also tests the environment Benjamin C. sent on Friday and answers with what works, what does not and open questions (Anna insisted; probably needs integrating). Daily (20 Oct): Camilo is testing it, Nicolás asks Benjamin C. for feedback. Daily (19 Oct): Nicolás, Toni and Anna agree on Carebase as a layer; Benjamin C. wants a full GoMedicus-side database citing Jens and data monetisation; Anna calls it viable only at millions of patients. Anna meets Benjamin C. and Jens tonight (20 Oct) and reports back.", "own": "Camilo", "esp": "Anna’s call with Benjamin C. and Jens tonight", "src": "Planning Sync · 19 Oct 17:10 + #gomedicus-planning · 19 Oct 15:25 + Daily Dev Sync · 19 Oct 12:00 + Daily Dev Sync · 20 Oct 10:00", "lastSignal": "2026-10-20", "nuevo": true}, {"id": "t-carebase-translator", "kind": "tema", "headline": "Carebase was meant as a translator saving relations; it now holds a full copy of Tomedo data", "detail": "daily-tech-data (13 Oct, 16:53–16:54): Nicolás wrote that he always thought of Carebase as a translator between PVS languages and a standard one, saving relations and not patient data; Anna replied that it was planned this way but Benjamin C. is fighting for more value and took more under Carebase. The 13 Oct demo shows the full nightly Tomedo copy. Legal status per the same demo: the lawyer confirmed the current reporting and controlling use is compliant, while CareConnect use needs a separate data agreement. Nicolás added that he fears the project \"explodes in our faces\" and the best case is missed deadlines. This is the 12 Oct \"partitioned mirror per MVZ\" recommendation reaching a different conclusion than the original design; no source records a decision.", "own": "", "esp": "needs an owner", "src": "daily-tech-data · 13 Oct 16:53 + Billing Engine prep · 13 Oct 14:30", "lastSignal": "2026-10-13", "nuevo": true}, {"id": "t-carebase-roadmap7", "kind": "tema", "headline": "Carebase roadmap: 7 releases, first full working system committed for 15 Jan 2027", "detail": "Billing Engine prep (13 Oct 14:30), Benjamin C.’s Notion roadmap (status 9 Oct): R0 Finance v0 (14 Sep, live), R1 reporting slice on real Tomedo data (paused), R2 October: INDAMED HL7 gateway built and demo planned, patient-search proof of concept for CareConnect slightly delayed pending contracts with AllSoft, load testing postponed, hosting decision open; R3 November: asynchronous two-way CareConnect communication, CareConnect writes requirements first; R4 December coverage waves; R5 15 Jan 2027 committed; R6 Q1 2027 geo-redundancy and write-back, scoped but not promised. Action: Benjamin C. shares the roadmap and demo materials. The team should not commit resources to the HL7 gateway until Intermate is confirmed as the vendor.", "own": "Benjamin C.", "esp": "Confirmation that Intermate is the HL7 gateway vendor", "src": "Billing Engine prep · 13 Oct 14:30", "lastSignal": "2026-10-13", "nuevo": true}, {"id": "t-carebase-arch", "kind": "tema", "headline": "Carebase architecture agreed: FHIR data platform behind CareConnect, roadmap to January", "detail": "Two meetings this window (Data and Product Roadmap sync 13:30 and Platform Walkthrough Weekly Kickoff 12:30, both 14 Sep) laid out Carebase: a data platform aggregating patient records from Tomato, Intermid, MediaX and other partners, normalized to FHIR R4 and stored in PostgreSQL. Insurance number is the hard key for patient matching (a meta key covers self-payers with none; soft matching on name+birthdate handles a changed insurance number). Output is a RESTful FHIR API behind a custom tenant/role system. Carebase's role vs. CareConnect's: Carebase is the single source of truth (read + writeback from Tomato), CareConnect is the application layer — e.g. CareConnect handles invoice display and payment flow, Carebase holds the pricing indexes and multiplicators, actual payment data flows back to Carebase and onward to Intermed/Krankenkassen. Full replacement of direct Tomato access by CareConnect is the long-term goal but must happen in stages, not all at once, to avoid freezing the platform for 1-2 years. Roadmap: October — Kubernetes on Hetzner, demo running, HL7 ingestion live; November — CareConnect reads Carebase (the milestone Nicolás flagged as the unlock for displaying patient data in CareConnect), payment/invoice data via a custom FHIR pricing profile; end of year — all read positions in the database; end of January — full working system. Planned team to January: Benjamin C. full-time plus one in-house FHIR backend developer plus one Cloudnonic developer, ~€500k in personnel plus ~€100k for ISO 27001/C5 certification, maintenance costs beyond January not yet planned. A proof-of-concept reporting engine (~25k lines, Claude-generated) is already committed to GitHub — a finance dashboard with Keycloak SSO meant to replace Arvid's 20,000-row Google Sheet, not yet live pending Tomato access. Regulatory pressure adds two near-term dates: the Medikationsplan (medication plan) goes live in Germany in November, and SMC-B e-prescription doctor signatures become a regulatory obligation from February 2027 — pharmacies are already asking, and accelerating it would strengthen the pharmacy pipeline.", "own": "Benjamin C.", "esp": "Benjamin Christ's 16-point roadmap adjustment list and Anna's per-feature component descriptions, both due to align the two roadmaps", "src": "Data and Product Roadmap sync · 14 Sep 13:30 + Platform Walkthrough Weekly Kickoff · 14 Sep 12:30", "lastSignal": "2026-09-14", "nuevo": true}, {"id": "t-carebase-delivery", "kind": "tema", "headline": "Timeline sharpened: 5-9 months for Carebase itself, Kids ships first, then partner journey from 15 Oct", "detail": "See the Data integration (Tomedo) initiative's ongoing thread on Benjamin C.'s output and access — this is that thread's resolution point. Nicolás, Anna and Benjamin H agreed a concrete, genuine deliverable rather than another review: read-only patient search connecting to Tomato, returning basic patient data inside Carebase, due Friday 18 September. Framed to Benjamin C. as an urgent platform need, not a performance test, so he doesn't feel re-interviewed — Benjamin H is sending read-only Tomato credentials if needed, and once the connection exists, pulling data is the easy part; data quality inside Tomato is the real challenge. Jens is expected to deliver the message himself (Benjamin C. listens to Jens) via a new shared channel with the three of them plus Benjamin C. If the POC isn't delivered Friday, all three are aligned to escalate to Jens and recommend a change; a contingency candidate is already in the pipeline — Gabriel Lucas Sobral de Araújo, a Brazilian senior engineer with an HL7 background, fluent German, intermediate Spanish, notice period October/November, with an interview invite already sent by Benjamin H. Open question raised in the same meeting: whether Nicolás, Anna and Benjamin H plus 1-2 internal GoMedicus developers could simply own Carebase directly instead of hiring for the role — Anna is willing to take on provider communication (Tolsoft etc.) if it comes to that. Update 21 Sep: no source checked this sweep (Data Integration Chat was empty in-window) confirms whether the Friday POC was delivered or what it showed — the go/no-go decision on Benjamin C. is now overdue rather than merely approaching. Worth a direct check before next sweep. New context from yesterday evening: Jens pushed out the contractor who had been running Carebase (a third party, distinct from Benjamin C. or Benjamin H.) — opening the door for Cloudnonic to own the workstream instead. The proof of concept is scoped: backend reads the Tomedo DB, matches users in Care Connect, and surfaces clinical info in the patient drawer. Target is 1 to 6 weeks; if it lands, Jens is expected to fund 3–4 more developers on it. Benjamin H. is driving the PoC personally right now (VPN and DB access already requested); Camilo has been proposed as the eventual lead given his technical depth and German, but pulling him off partner-API work would leave only Juanma and Ruiz on backend — Nicolás still needs to discuss it with Camilo directly, expected within about a week. Update 25 Sep: today's Daily Dev Sync sharpened the estimate — Anna puts the database alone at 5–6 months, 6–9 months for full development. Benjamin C.'s existing Claude-generated proof of concept isn't production-usable and Benjamin himself doesn't understand its code, so all real implementation falls to Nicolás's team. Roadmap: finish pediatrics first, then the full partner-user journey starting 15 Oct, with workflows to be agreed with Jens the same day and Anna preparing mockups after. Nicolás is planning to assign 1–2 engineers from 15 Oct — Camilo (frontend, speaks German) and Tumay (backend) proposed. Nicolás's own rough estimate for a connected MVP (data in\\/out, linked to CareConnect, surfaced in the appointment drawer) is about a month, but Anna cautioned that's solo-platform scope only — partner workflows add significant complexity on top.", "own": "Nicolás", "esp": "Nicolás's 1-on-1 with Camilo on taking the lead role, plus Benjamin H.'s still-pending Tomada access", "src": "post-call · 14 Sep 14:31 + Oferta aceptada, transición de Jens y estructura de Carebase con Benjamin · 23 Sep 18:00", "lastSignal": "2026-09-25", "nuevo": true}, {"id": "t-carebase-handover", "kind": "tema", "headline": "Benjamin has no visibility to the team in GitHub/Carebase — knowledge-transfer session to be scheduled", "detail": "Anna flagged before the meeting that Benjamin (C. or H.?) is working in GitHub/Carebase without visibility to the rest of the team and needs alignment before October planning. Nicolás to schedule a CareConnect knowledge-transfer session with Benjamin and Andreas (Anna and Toni optional), notes to Notion. Benjamin needs platform depth before the Tomedo integration can be scoped. Also on the table: KIM (inbound practice communication, needed to send receipts and documents to patients in-platform) — Nicolás offered to research certified alternatives, Anna says a provider partner will handle KIM, e-Rezept and electronic patient record access; open question is when each is needed so no contract is paid before use. Update 2 Oct (Daily Dev Sync): proposal to put 2–3 team members alongside the Carebase work to shadow and document it so scope is not single-threaded, and to name one decision-maker with final say on architecture. No owner or date yet. Update 6 Oct (Frontend Sync 5 Oct): Nicolás explained the three layers (CareConnect connectivity, CareGuide patient journey, still early, Carebase translator for PVS systems, multi-tenant) and said Carebase delivery is not progressing or collaborative, with a risk that the work is handed to the frontend team; his preferred outcome is bringing in an architect who collaborates. This sits against the 1 Oct note that Cloudnonic stays out of the Carebase repo, and the Daily's note that the data owner may move to GoMedicus or Prosmind.", "own": "Nicolás", "esp": "Decision on who takes Carebase if handed over; architect hire not confirmed", "src": "PVS+TI Integration Roadmap · 29 Sep 09:00 + Frontend Sync · 5 Oct 16:34", "lastSignal": "2026-10-05", "nuevo": true}, {"id": "t-carebase-reqs", "kind": "tema", "headline": "Cloudnonic stays out of the Carebase repo; Nicolás drafts requirements, Benjamin C. prepares Carebase", "detail": "Daily Dev Sync (1 Oct): Nicolás's team should not spend time in the Carebase repo. Nicolás prepares the platform to receive and write data back and drafts the technical requirements; Benjamin C. prepares Carebase or requests dev support. This narrows the 29 Sep plan above (a joint knowledge-transfer session and a Tomedo sync-design session led by Nicolás with Benjamin) — neither session is confirmed scheduled.", "own": "Nicolás", "esp": "Benjamin C. — Carebase readiness or a dev-support request", "src": "Daily Dev Sync · 1 Oct 10:00", "lastSignal": "2026-10-01", "nuevo": true}, {"id": "t-carebase-lattice", "kind": "tema", "headline": "Carebase billing view demoed 2 Oct; Tomedo write-back API docs still outstanding", "detail": "Lattice Work review (2 Oct): Carebase is a backend for reporting and operations; appointments and medications sync every 30 minutes, other tables nightly. Billing dashboard flags unbilled opportunities per clinic and per patient, with rules drawn from scraped German law; HZV and Selektivverträge edge cases are unresolved. Write-back to Tomedo is not implemented: API documentation was requested from Tomedo by email and is pending. Open question on whether CareConnect becomes system of record by ~2028 or everything keeps writing to Tomedo. Nicolás to consolidate Toni's input on the Carebase email before Monday's appointment. Update 14 Oct: still no Tomedo write-back (the Tomedo API does not support it; Benjamin C. is working on it). Demo 13 Oct: the central data repository maps patients, coverage, diagnoses, billing history and encounters to FHIR, with a nightly full sync (about 20 minutes) and an incremental sync every 30 minutes; the Baden-Württemberg day list showed 455 appointments and about €18,831 open billing. It currently runs on Benjamin C.’s local PC, with a move to Hetzner planned.", "own": "Benjamin C.", "esp": "Tomedo API documentation", "src": "Lattice Work · 2 Oct 16:00 + Billing Engine prep · 13 Oct 14:30", "lastSignal": "2026-10-13", "nuevo": false}, {"id": "t-billing-home", "kind": "tema", "headline": "Billing engine home: separate stateless service proposed 12 Oct, Carebase as data source", "detail": "Billing Sync (6 Oct 15:37): engine should live in Carebase so other organisations (e.g. VoraMedics) can consume it by API; partners would have to hand over PBS billing credentials, which is complex in Germany. Frontend Sync (6 Oct 18:46): consensus that it is a separate external service, possibly productised, with Carebase (FHIR) as one data source but not owner. Neither source references the other. Juanma drafts a high-level infrastructure proposal before today's Jens meeting; Juanma also reviews the docs from Anna and Jens and reports. Update 8 Oct (Daily Dev Sync): the engine-location question (external vs inside Carebase, the Cloudnonic proposal being external) is listed as an open blocker, and Jens now meets on Tue 14 Oct 9:00-10:00 instead of 7 Oct, so the Carebase-vs-separate-service conflict above stays unresolved for six more days. Nicolas prepares the technical questions with Juanma. Update 12 Oct (Weekly 9 Oct): Jens wants the engine as a standalone microservice that pulls data; Benjamin H. wants data to stay in Carebase with the engine requesting it; Benjamin C. wants the engine to define its interface and Carebase to deliver. Only agreement: start with a basic FHIR/API endpoint from Carebase so CareConnect can pull patient data into the drawer. No module owner for the billing engine was named, and Jens wants 2-3 dedicated engineers while Benjamin H. says Carebase must be live first. Update 12 Oct (Becoming billing experts): Nicolás and Juanma sketched the engine as stateless (no patient data stored, code suggestions only), deployed as a single Lambda, fully dependent on Carebase for code lists per KV, patient history and practice data, while Carebase can exist without it; multi-environment support is a requirement because Benjamin C.’s layer has a single environment. This leans to the separate-service side, but it was written by Cloudnonic only; the Billing Sync of 6 Oct that placed it inside Carebase is not reconciled. Open: who owns the rejection-correction UI. Update 14 Oct (Billing Engine prep 13 Oct 14:30): location is still undecided, CareConnect versus Carebase; Benjamin C.’s architecture has the engine called by CareConnect, which fetches a minimal patient package (billing codes, ICD codes, program enrollments) from Carebase, returns code proposals to the doctor, and approved codes go back through Carebase to Tomedo. The decision should involve Jens before Thursday’s meeting.", "own": "Juanma", "esp": "Jens technical deep-dive, Tue 14 Oct 9:00", "src": "Billing Sync · 6 Oct 15:37 + Frontend Sync · 6 Oct 18:46 + Becoming billing experts · 12 Oct 18:02 + Billing Engine prep · 13 Oct 14:30", "lastSignal": "2026-10-13", "nuevo": false}, {"id": "t-carebase-scenarioc", "kind": "tema", "headline": "Carebase architecture: partitioned mirror per MVZ recommended; pooled table rejected", "detail": "Benjamin H. presented Scenario C at the 9 Oct Weekly: a partitioned Carebase mirror with a master patient index and a consent projection (about 20 relevant tables of 2,300, one consent row per patient and source, 90-day treatment window, HAPI FHIR R4 on PostgreSQL, consent gate as an interceptor). Scenario A (one pooled table) was explicitly rejected because a missed consent filter risks §203 StGB exposure. Carebase ownership sits with Benjamin C.; CareConnect/Cloudnonic should not need to know its internals.", "own": "Benjamin C.", "esp": "basic FHIR/API endpoint for CareConnect", "src": "Tech &amp; Platform Office Weekly · 9 Oct 14:30", "nuevo": true, "lastSignal": "2026-10-12"}, {"id": "t-ti-summit", "kind": "tema", "headline": "TI Summit summary pending; Benjamin C. meets Professor Jens in Essen Wed 14 Oct about Carebase", "detail": "Benjamin C. and Andreas Schwarz attended; Benjamin C. is to present a summary (TI 2.0, POP slipped to end 2027, TI Messenger, DiGA, a Pharma4U lead that tomedo declined and GoMedicus could broker).", "own": "Benjamin C.", "esp": "nobody", "src": "Tech &amp; Platform Office Weekly · 9 Oct 14:30", "nuevo": true, "lastSignal": "2026-10-12"}, {"id": "t-carebase-brief", "kind": "tema", "headline": "Carebase technical brief not yet sent; patient lookup and ICD write-back, hard date 20 Oct", "detail": "Daily Dev Sync (15 Oct): the plan is a two-way sync, the platform sends patient ID and insurance number and Carebase returns patient data, and the platform writes doctor notes (ICD codes, SOAP) back to Carebase, which forwards them to the PVS. Test cases are patient lookup by insurance number and ICD code and summary write-back, needing a staging environment from Benjamin C.; hard deadline 20 Oct. The requirements still had to be reformatted into a brief and shared before today’s meeting with Jens, so the brief had not gone out by 10:00 today. Nicolás’s Carebase vision doc went to Anna on 14 Oct. A Carebase meeting with Sebastian, Benjamin C. and Toni is planned for 15 Oct, recorded, to extract data requirements.", "own": "Nicolás", "esp": "Benjamin C.’s staging environment", "src": "Daily Dev Sync · 14 Oct 13:00 + daily-tech-data · 14 Oct 13:57 + Daily Dev Sync · 15 Oct 10:00", "nuevo": true, "lastSignal": "2026-10-15"}, {"id": "t-carebase-legaldata", "kind": "tema", "headline": "Carebase stores patient data permanently; legal position not given yet", "detail": "Daily Dev Sync (14 Oct): Benjamin C. is saving patient data permanently, which is probably not legally permissible. Nicolás’s view is that Carebase should hold only references and IDs, and that the legal and consent question must be answered before more development. Sebastian (legal) has not stated a clear position. Benjamin C. also built a billing prototype inside Carebase on real data, and GDPR concerns were raised with the team; a follow-up with Jens is planned. Update 16 Oct: at S.2 (15 Oct) Benjamin C. said the legal review is ongoing but not complete, so the position Sebastian was to give is still open.", "own": "Sebastian", "esp": "a clear legal position on storing patient data", "src": "Daily Dev Sync · 14 Oct 13:00 + Multitenant architecture, booking flow and video provider · 14 Oct 14:53 + Careconnext x Carebase S.2 · 15 Oct 18:00", "nuevo": false, "lastSignal": "2026-10-16"}, {"id": "t-carebase-session", "kind": "tema", "headline": "Held 15 O <script id="code">


(function(){
  var LINKS = '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">';
  var EST = {disc:["In discussion","c-disc"], wait:["Waiting on decision","c-wait"], plan:["Needs plan","c-plan"], exec:["In progress","c-exec"]};
  var app = document.getElementById("app");
  var S = JSON.parse(document.getElementById("state").textContent);
  var api = null, saving = false;
  var view = "init";           // "init" | "owner"
  var openCards = {};          // ephemeral UI state, not persisted
  var openItems = {};

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function pinMark(t, f){ return (t && t.pin && t.pin[f]) ? '<span class="pinm" title="Set by hand — the next run will not overwrite it">●</span>' : ''; }
  function ageDays(iso){
    if (!iso) return null;
    var d = new Date(iso+"T00:00:00");
    if (isNaN(d)) return null;
    var now = new Date(); now.setHours(0,0,0,0);
    return Math.round((now - d) / 86400000);
  }
  function ageChip(iso){
    var n = ageDays(iso);
    if (n === null) return "";
    var label = n <= 0 ? "today" : n === 1 ? "1 day" : n + " days";
    var stale = n >= 4 ? " stale" : "";
    return '<span class="age'+stale+'" title="Last signal: '+esc(iso)+'">'+label+'</span>';
  }
  function estChip(est){ var e = EST[est] || EST.disc; return '<span class="chip '+e[1]+'">'+e[0]+'</span>'; }
  function statusSel(ini){
    var o = "";
    ["disc","wait","plan","exec"].forEach(function(k){ o += '<option value="'+k+'"'+(ini.estado===k?' selected':'')+'>'+EST[k][0]+'</option>'; });
    return '<select class="stsel '+(EST[ini.estado]||EST.disc)[1]+'" data-sel="'+esc(ini.id)+'" title="Change this initiative\'s status">'+o+'</select>';
  }

  function allItemsFlat(){
    var out = [];
    S.iniciativas.forEach(function(ini){
      ini.items.forEach(function(it){ out.push({ini:ini, it:it}); });
    });
    return out;
  }
  function findIniAndItem(itemId){
    for (var i=0;i<S.iniciativas.length;i++){
      var ini = S.iniciativas[i];
      for (var j=0;j<ini.items.length;j++){
        if (ini.items[j].id === itemId) return {ini:ini, it:ini.items[j], idx:j};
      }
    }
    return null;
  }
  function findIni(iniId){
    return S.iniciativas.filter(function(x){ return x.id === iniId; })[0];
  }

  function render(){
    var canEdit = !!api;
    var h = "";
    h += '<h1>Command Board</h1>';
    h += '<div class="sub">State as of '+esc(S.fecha)+' · last sweep: '+esc(S.barrido)+'</div>';
    h += '<p class="q">Where every initiative between GoMedicus and Cloudnonic stands, who holds it, and what is waiting on someone. Click a card or a row to expand it.</p>';

    if (canEdit) {
      h += '<div class="bar"><span class="st" id="st"></span><span style="font-size:11.5px;color:var(--faint)">Editing on — changes save for everyone</span></div>';
    }

    // ---- attention strip ----
    var flags = [];
    S.iniciativas.forEach(function(ini){
      if (ini.attention) flags.push({kind:"ini", id:ini.id, name:ini.nombre, why:ini.attention.why, tag:ini.attention.tag, who:ini.own||"no owner", pin: ini.pin && ini.pin.attention});
    });
    (S.atencion_cruzada||[]).forEach(function(x){
      flags.push({kind:"cross", id:x.id, name:x.headline, why:x.why, tag:x.tag, afecta:x.afecta||[], pin: x.pin && x.pin.attention});
    });
    if (flags.length){
      h += '<h2>Attention today</h2><p class="hint">Only what shows an observable urgency signal: a date on it, overdue, owner disputed, or blocking two or more initiatives at once.</p>';
      flags.forEach(function(f){
        h += '<div class="att">'
          +  '<div class="att-top"><span class="att-tag">'+esc(f.tag)+'</span><span class="t">'+esc(f.name)+'</span></div>'
          +  '<div class="why">'+esc(f.why)+'</div>'
          +  (f.who ? '<div class="who">who: <b>'+esc(f.who)+'</b></div>' : '')
          +  (f.afecta && f.afecta.length ? '<div class="aff">Affects: '+f.afecta.map(function(n){ return '<a data-jump="'+esc(n)+'">'+esc(n)+'</a>'; }).join(', ')+'</div>' : '')
          +  (canEdit ? '<div class="iacts"><button data-act="clearatt" data-kind="'+f.kind+'" data-id="'+esc(f.id)+'" title="Not urgent today">Not urgent today</button></div>' : '')
          +  '</div>';
      });
    }

    // ---- view toggle ----
    h += '<h2>Initiatives<span class="viewbar"><button class="vbtn'+(view==="init"?" on":"")+'" data-view="init">By initiative</button><button class="vbtn'+(view==="owner"?" on":"")+'" data-view="owner">By owner</button></span></h2>';
    h += '<p class="hint">Everything the team is carrying, grouped the way a leader thinks about it — collapsed by default. Click to expand.</p>';

    if (view === "owner") {
      h += renderByOwner(canEdit);
    } else {
      h += renderByInitiative(canEdit);
    }

    // ---- done ----
    h += '<h2>Done</h2><p class="hint">Meeting-ready — one line each, plain language, no jargon. Read it out as-is.</p>';
    if (S.done && S.done.length){
      h += '<details class="donewrap" open><summary>'+S.done.length+' marked done</summary>';
      h += '<div class="card">';
      S.done.forEach(function(t){
        var tks = (t.tk && t.tk.length)
          ? t.tk.map(function(k){ return '<a class="tkt" href="https://linear.app/gomedicusgroup/issue/'+encodeURIComponent(k.toLowerCase())+'" target="_blank" rel="noopener">'+esc(k)+'</a>'; }).join('')
          : '<span class="none">no ticket</span>';
        h += '<div class="donerow">'
          + '<div class="dleft">'
          +   '<div class="dtopic'+(canEdit?' ed':'')+'" '+(canEdit?'data-edit="t" data-done-id="'+esc(t.id)+'" tabindex="0" title="Click to fix the topic name"':'')+'>'+esc(t.t)+(t.iniciativa?'<span class="dini">'+esc(t.iniciativa)+'</span>':'')+'</div>'
          +   '<div class="dsum'+(canEdit?' ed':'')+'" '+(canEdit?'data-edit="doneSummary" data-done-id="'+esc(t.id)+'" tabindex="0" title="Click to edit — plain language, for meetings"':'')+'>'+esc(t.doneSummary||"No summary yet — click to add one.")+'</div>'
          +   '<div class="dmeta">'+esc(t.own)+' · '+tks+'</div>'
          + '</div>'
          + '<div class="dright">'
          +   '<span class="ddate">'+esc(t.doneAt||"")+'</span>'
          +   (canEdit ? '<button data-act="restore" data-id="'+esc(t.id)+'" title="Not actually done — bring it back">Restore</button>' : '')
          + '</div>'
          + '</div>';
      });
      h += '</div></details>';
    } else {
      h += '<p class="hint">Nothing marked done yet.</p>';
    }

    h += '<footer class="foot">Built from meetings recorded in Granola, 7 Slack sources and the GoMedicus Dev team in Linear. It does not see DMs, email or unrecorded meetings. Owners are inferred from what was said in each source — if one is wrong, fix it here. Status for ticketed items is read from Linear, never written by hand.</footer>';

    app.innerHTML = h;
    wireEvents(canEdit);
  }

  function renderByInitiative(canEdit){
    var h = "";
    S.iniciativas.forEach(function(ini){
      var open = !!openCards[ini.id];
      var ages = ini.items.map(function(it){ return it.lastSignal; }).filter(Boolean).sort().reverse();
      var freshest = ages[0] || ini.lastSignal;
      h += '<div class="card'+(open?' open':'')+(ini.attention?' is-att':'')+(canEdit?'':' edit-off')+'" data-card="'+esc(ini.id)+'">';
      h += '  <div class="chead" data-toggle-card="'+esc(ini.id)+'">';
      h += '    <div class="left">';
      h += '      <div class="cname">'+(canEdit?statusSel(ini):estChip(ini.estado))+pinMark(ini,'estado')+' '+esc(ini.nombre)+(ini.nuevo?'<span class="newb">new</span>':'')+'</div>';
      h += '      <div class="cmeta"><span class="own">'+esc(ini.own||"no owner")+pinMark(ini,'own')+'</span><span>waiting on: '+esc(ini.esp||"nobody")+pinMark(ini,'esp')+'</span></div>';
      h += '    </div>';
      h += '    <div class="cright">'+ageChip(freshest)+'<span class="count">'+ini.items.length+' item'+(ini.items.length===1?'':'s')+'</span><span class="chevron">▸</span></div>';
      h += '  </div>';
      h += '  <div class="cbody">';
      ini.items.forEach(function(it){ h += renderItem(it, ini, canEdit); });
      if (canEdit){
        h += '  <div class="cacts">'
          + '<button data-act="editown" data-id="'+esc(ini.id)+'" data-scope="ini">Edit owner / waiting-on</button>'
          + (ini.attention ? '<button data-act="clearatt" data-kind="ini" data-id="'+esc(ini.id)+'">Clear attention</button>' : '<button data-act="setatt" data-id="'+esc(ini.id)+'">Flag for attention</button>')
          + '<button data-act="closeini" data-id="'+esc(ini.id)+'" title="Remove this whole initiative">Close initiative</button>'
          + '</div>';
      }
      h += '  </div>';
      h += '</div>';
    });
    return h;
  }

  function renderItem(it, ini, canEdit){
    var open = !!openItems[it.id];
    var h = '<div class="item'+(open?' open':'')+'" data-item="'+esc(it.id)+'">';
    h += '  <div class="irow" data-toggle-item="'+esc(it.id)+'">';
    h += '    <span class="ikindmark'+(it.kind==="ejec"?' ejec':'')+'" title="'+(it.kind==="ejec"?"Ticketed":"No ticket")+'"></span>';
    h += '    <span class="iheadline">'+esc(it.headline)+(it.nuevo?'<span class="newb">new</span>':'')+'</span>';
    h += '    <span class="ichev">▸</span>';
    h += '  </div>';
    h += '  <div class="idetail">';
    h += '    <div class="idtext'+(canEdit?' ed':'')+'" '+(canEdit?'data-edit="detail" data-id="'+esc(it.id)+'" tabindex="0" title="Click to edit"':'')+'>'+esc(it.detail)+pinMark(it,'detail')+'</div>';
    if (it.kind === "ejec"){
      if (it.tkSummary){ h += '<div class="tksum">'+esc(it.tkSummary)+'</div>'; }
      var tks = (it.tk||[]);
      h += '<div class="itk">'+(tks.length ? tks.map(function(k){ return '<a class="tkt" href="https://linear.app/gomedicusgroup/issue/'+encodeURIComponent(k.toLowerCase())+'" target="_blank" rel="noopener">'+esc(k)+'</a>'; }).join('') : '<span class="none">no ticket</span>')+pinMark(it,'tk')+'</div>';
      h += '<div class="iowners">owner: <b>'+esc(it.own||"no owner")+'</b>'+pinMark(it,'own')+' · dev: '+esc(it.dev||"—")+pinMark(it,'dev')+'</div>';
      if (it.flag) h += '<div class="flagline">'+esc(it.flag)+'</div>';
    } else {
      h += '<div class="iowners">owner: <b>'+esc(it.own||"no owner")+'</b>'+pinMark(it,'own')+' · waiting on: '+esc(it.esp||"nobody")+pinMark(it,'esp')+'</div>';
    }
    h += '<div class="isrc">'+esc(it.src)+' · last signal '+esc(it.lastSignal||"")+'</div>';
    if (canEdit){
      h += '<div class="iacts">'
        + '<button data-act="edithead" data-id="'+esc(it.id)+'">Edit headline</button>'
        + (it.kind === "ejec" ? '<button data-act="edittk" data-id="'+esc(it.id)+'">Edit tickets</button><button data-act="donedone" data-id="'+esc(it.id)+'">Mark done</button>' : '<button data-act="promote" data-id="'+esc(it.id)+'" data-ini="'+esc(ini.id)+'">Move to in progress</button>')
        + '<button data-act="rmitem" data-id="'+esc(it.id)+'">Remove</button>'
        + '</div>';
    }
    h += '  </div>';
    h += '</div>';
    return h;
  }

  function renderByOwner(canEdit){
    var groups = {};
    allItemsFlat().forEach(function(pair){
      var o = pair.it.own || "no owner";
      (groups[o] = groups[o] || []).push(pair);
    });
    var owners = Object.keys(groups).sort(function(a,b){
      if (a === "no owner") return 1;
      if (b === "no owner") return -1;
      return groups[b].length - groups[a].length;
    });
    var h = "";
    owners.forEach(function(o){
      h += '<div class="ownergroup"><div class="ownername">'+esc(o)+'<span class="n">'+groups[o].length+' item'+(groups[o].length===1?'':'s')+'</span></div>';
      groups[o].forEach(function(pair){
        var it = pair.it, ini = pair.ini;
        var open = !!openItems[it.id];
        h += '<div class="card'+(open?' open':'')+(canEdit?'':' edit-off')+'" data-card="own-'+esc(it.id)+'">';
        h += '  <div class="chead" data-toggle-item="'+esc(it.id)+'" data-toggle-owner="1">';
        h += '    <div class="left"><div class="cname" style="font-size:13.5px">'+esc(it.headline)+'</div><div class="cmeta"><span>'+esc(ini.nombre)+'</span></div></div>';
        h += '    <div class="cright">'+ageChip(it.lastSignal)+'<span class="chevron">▸</span></div>';
        h += '  </div>';
        if (open){
          h += '  <div class="cbody" style="display:block"><div class="item open"><div class="idetail" style="display:block">';
          h += '<div class="idtext">'+esc(it.detail)+'</div>';
          if (it.kind === "ejec" && it.tk && it.tk.length){ h += '<div class="itk">'+it.tk.map(function(k){ return '<a class="tkt" href="https://linear.app/gomedicusgroup/issue/'+encodeURIComponent(k.toLowerCase())+'" target="_blank" rel="noopener">'+esc(k)+'</a>'; }).join('')+'</div>'; }
          h += '<div class="isrc">'+esc(it.src)+'</div>';
          h += '</div></div></div>';
        }
        h += '</div>';
      });
      h += '</div>';
    });
    return h;
  }

  function status(msg){ var el = document.getElementById("st"); if (el) el.textContent = msg || ""; }

  function serialize(){
    var json = JSON.stringify(S).replace(/</g, "\\u003c");
    var code = document.getElementById("code").textContent;
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>'
      + '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
      + '<title>Command Board</title>' + LINKS
      + document.getElementById("sty").outerHTML
      + '</head><body><div class="wrap" id="app"></div>'
      + '<script type="application/json" id="state">' + json + '<\/script>'
      + '<script id="code">' + code + '<\/script>'
      + '</bo'+'dy></html>';
  }

  function save(){
    if (!api || saving) return;
    saving = true; status("Saving…");
    var html = serialize();
    api.publish(html).then(function(){ saving=false; status("Saved"); }).catch(function(e){
      saving=false;
      if (e && (e.code==="not_writer"||e.code==="not_granted")){ api=null; render(); return; }
      status(e && e.code==="conflict" ? "Someone else saved first — reloading" : "Save failed");
    });
  }
  function ask(title, fields, cb){
    var bg=document.createElement("div"); bg.className="modal-bg";
    var m='<div class="modal"><h3>'+esc(title)+'</h3>';
    fields.forEach(function(f,i){ m+='<label>'+esc(f.label)+'</label>'+(f.multi?'<textarea data-f="'+i+'">'+esc(f.value||"")+'</textarea>':'<input data-f="'+i+'" value="'+esc(f.value||"")+'">'); });
    m+='<div class="mbtns"><button data-m="no">Cancel</button><button class="primary" data-m="ok">OK</button></div></div>';
    bg.innerHTML=m; document.body.appendChild(bg);
    var first=bg.querySelector("[data-f]"); if(first) first.focus();
    bg.addEventListener("click",function(e){
      var b=e.target.closest("[data-m]");
      if(e.target===bg||(b&&b.dataset.m==="no")){ document.body.removeChild(bg); return; }
      if(b&&b.dataset.m==="ok"){ var v=[].map.call(bg.querySelectorAll("[data-f]"),function(x){return x.value;}); document.body.removeChild(bg); cb(v); }
    });
  }
  function pin(o,f){ o.pin=o.pin||{}; o.pin[f]=true; }
  function commit(){ render(); save(); }
  function today(){ var d=new Date(); return d.toISOString().slice(0,10); }
  function list(v){ return v.split(",").map(function(x){return x.trim();}).filter(Boolean); }

  function act(a, el){
    var id=el.dataset.id, r;
    if (a==="clearatt"){
      if (el.dataset.kind==="cross"){ S.atencion_cruzada=S.atencion_cruzada.filter(function(x){return x.id!==id;}); }
      else { var ini=findIni(id); if(ini){ ini.attention=null; pin(ini,"attention"); } }
      return commit();
    }
    if (a==="setatt"){ var i2=findIni(id); return ask("Flag for attention",[{label:"Why (max two sentences)",multi:1},{label:"Tag"}],function(v){ i2.attention={why:v[0],tag:v[1]}; pin(i2,"attention"); commit(); }); }
    if (a==="editown"){ var i3=findIni(id); return ask("Owner and waiting-on",[{label:"Owner",value:i3.own},{label:"Waiting on",value:i3.esp}],function(v){ i3.own=v[0]; i3.esp=v[1]; pin(i3,"own"); pin(i3,"esp"); commit(); }); }
    if (a==="closeini"){ if(!confirm("Remove this whole initiative?")) return; S.iniciativas=S.iniciativas.filter(function(x){return x.id!==id;}); return commit(); }
    if (a==="restore"){
      var di=S.done.filter(function(x){return x.id===id;})[0]; if(!di) return;
      S.done=S.done.filter(function(x){return x.id!==id;});
      var tgt=S.iniciativas.filter(function(x){return x.nombre===di.iniciativa;})[0];
      if(!tgt){ tgt={id:"init-"+id,nombre:di.iniciativa||di.t,estado:"exec",own:di.own||"",esp:"nobody",attention:null,lastSignal:today(),nuevo:false,items:[]}; S.iniciativas.push(tgt); }
      tgt.items.push({id:di.id,kind:(di.tk&&di.tk.length)?"ejec":"tema",headline:di.t,detail:di.nv||di.doneSummary||"",own:di.own||"",dev:di.dev||"",tk:di.tk||[],esp:"nobody",src:di.src||"",flag:di.flag||"",lastSignal:today(),nuevo:false});
      return commit();
    }
    r=findIniAndItem(id); if(!r) return;
    var it=r.it;
    if (a==="edithead") return ask("Headline",[{label:"Headline (max 12 words)",value:it.headline}],function(v){ it.headline=v[0]; pin(it,"headline"); commit(); });
    if (a==="edittk") return ask("Tickets",[{label:"Comma-separated ticket IDs",value:(it.tk||[]).join(", ")}],function(v){ it.tk=list(v[0]).map(function(x){return x.toUpperCase();}); pin(it,"tk"); commit(); });
    if (a==="rmitem"){ if(!confirm("Remove this item?")) return; r.ini.items.splice(r.idx,1); if(!r.ini.items.length) S.iniciativas=S.iniciativas.filter(function(x){return x!==r.ini;}); return commit(); }
    if (a==="promote") return ask("Move to in progress",[{label:"Developer",value:it.own},{label:"Tickets (optional, comma-separated)"}],function(v){ it.kind="ejec"; it.dev=v[0]; it.tk=list(v[1]).map(function(x){return x.toUpperCase();}); it.flag=it.flag||""; r.ini.estado="exec"; commit(); });
    if (a==="donedone") return ask("Mark done",[{label:"One plain-language line for the meeting",multi:1}],function(v){
      S.done.unshift({id:it.id,t:it.headline,own:it.own,dev:it.dev,tk:it.tk||[],nv:it.detail,src:it.src,flag:it.flag||"",doneAt:today(),doneSummary:v[0],iniciativa:r.ini.nombre});
      r.ini.items.splice(r.idx,1); if(!r.ini.items.length) S.iniciativas=S.iniciativas.filter(function(x){return x!==r.ini;}); commit(); });
  }

  function wireEvents(canEdit){
    app.onclick=function(e){
      var t=e.target;
      var b=t.closest("[data-act]"); if(b&&canEdit){ e.stopPropagation(); return act(b.dataset.act,b); }
      var v=t.closest("[data-view]"); if(v){ view=v.dataset.view; return render(); }
      var j=t.closest("[data-jump]"); if(j){ var n=j.dataset.jump; var ini=S.iniciativas.filter(function(x){return x.nombre===n;})[0]; if(ini){ view="init"; openCards[ini.id]=true; render(); var c=app.querySelector('[data-card="'+ini.id+'"]'); if(c) c.scrollIntoView({block:"start"}); } return; }
      if (canEdit && t.closest("[data-sel]")) return;
      var ed=t.closest("[data-edit]");
      if(ed&&canEdit){
        var f=ed.dataset.edit;
        if(ed.dataset.doneId){ var d=S.done.filter(function(x){return x.id===ed.dataset.doneId;})[0]; return ask(f==="t"?"Topic":"Summary",[{label:f==="t"?"Topic":"Summary",value:d[f],multi:1}],function(x){ d[f]=x[0]; commit(); }); }
        var rr=findIniAndItem(ed.dataset.id); if(rr) return ask("Detail",[{label:"Detail",value:rr.it.detail,multi:1}],function(x){ rr.it.detail=x[0]; pin(rr.it,"detail"); commit(); });
        return;
      }
      var ti=t.closest("[data-toggle-item]");
      if(ti){ var k=ti.dataset.toggleItem; openItems[k]=!openItems[k]; return render(); }
      var tc=t.closest("[data-toggle-card]");
      if(tc){ var c2=tc.dataset.toggleCard; openCards[c2]=!openCards[c2]; return render(); }
    };
    app.onchange=function(e){
      var sel=e.target.closest("[data-sel]"); if(!sel||!canEdit) return;
      var ini=findIni(sel.dataset.sel); if(!ini) return;
      ini.estado=sel.value; pin(ini,"estado"); commit();
    };
  }

  render();
  if (window.claude && window.claude.use){
    window.claude.use("artifact").then(function(a){ if(a){ api=a; render(); } }).catch(function(){});
  }
})();
</script>
</body></html>
